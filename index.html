<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>Bingling Liu — Learning &amp; Programme Support</title><meta name="description" content="Portfolio of Bingling Liu: adult education, learning delivery and programme support in Auckland, New Zealand."></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
/* Layout: designer-portfolio bento grid. Big colour tiles with animated art, titles only; every tile opens a sample in a sheet. */
:root{
  --bg:#f6f6f3; --surface:#ffffff; --ink:#111216; --muted:#62646e; --line:#e3e3df;
  --t-teal:#1d8a7a; --t-blue:#2f9e8e; --t-sun:#dcefe9; --t-coral:#e8914f; --t-ink:#0e3d45; --t-lilac:#a9dccf;
  --on-dark:#ffffff; --on-light:#0e2f35;
  --soft-teal:#d8efe9; --soft-blue:#e6f3f0; --soft-sun:#fbeedd; --soft-coral:#fbe2d2;
  --display:"Unbounded","Segoe UI",system-ui,sans-serif;
  --body:"Manrope","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0d11; --surface:#17181f; --ink:#f1f1ee; --muted:#a1a3ad; --line:#2a2c35; --t-ink:#123f47;
  --soft-teal:#123532; --soft-blue:#16302f; --soft-sun:#3a2c1e; --soft-coral:#3a261b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0d11; --surface:#17181f; --ink:#f1f1ee; --muted:#a1a3ad; --line:#2a2c35; --t-ink:#123f47;
  --soft-teal:#123532; --soft-blue:#16302f; --soft-sun:#3a2c1e; --soft-coral:#3a261b; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.02;text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--t-coral);outline-offset:3px;border-radius:12px}

.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:230px;gap:12px}
.tile{position:relative;border:0;border-radius:28px;overflow:hidden;text-align:left;padding:0;cursor:pointer;isolation:isolate;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.tile:hover{transform:translateY(-4px)}
.tile .art{position:absolute;inset:0;z-index:-1;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.tile:hover .art{transform:scale(1.06)}
.tile .art svg{width:100%;height:100%;display:block}
.cap{position:absolute;left:22px;right:60px;bottom:20px}
.cap h3{font-size:22px;font-weight:700;letter-spacing:-.01em}
.cap span{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-top:6px;opacity:.85}
.arrow{position:absolute;right:18px;bottom:18px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:rgba(255,255,255,.22);transition:transform .3s,background .3s}
.tile:hover .arrow{transform:rotate(45deg);background:rgba(255,255,255,.4)}
.c2{grid-column:span 2} .r2{grid-row:span 2}
.teal{background:var(--t-teal);color:var(--on-dark)} .blue{background:var(--t-blue);color:var(--on-dark)}
.sun{background:var(--t-sun);color:var(--on-light)} .coral{background:var(--t-coral);color:var(--on-dark)}
.inkt{background:var(--t-ink);color:var(--on-dark)} .deep{background:#163a3f;color:var(--on-dark)} .lilac{background:var(--t-lilac);color:var(--on-light)}
.sun .arrow,.lilac .arrow{background:rgba(0,0,0,.08)}

/* hero */
.hero{grid-column:span 2;grid-row:span 2;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:28px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.hero .av{width:64px;height:64px;border-radius:20px;background:conic-gradient(from 200deg,var(--t-ink),var(--t-teal),var(--t-lilac),var(--t-coral),var(--t-ink));display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;font-size:22px;animation:spin 12s linear infinite}
.hero .av span{animation:spin 12s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.hero h1{font-size:clamp(44px,6.4vw,78px);font-weight:800;letter-spacing:-.04em}
.hero h1 em{font-style:normal;color:var(--t-teal)}
.hero .line{font-size:19px;color:var(--muted);margin:12px 0 0;max-width:30ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;background:var(--bg)}
.x-unused{cursor:pointer;background:var(--t-teal);color:#fff;border-color:var(--t-teal)}
.letterbtn:hover{filter:brightness(1.08)}
.cvbtn{cursor:pointer}
.cvbtn:hover{border-color:var(--ink)}
.cv h4{font-family:var(--display);font-size:17px;margin:0}
.cv .org{color:var(--muted);font-size:14px;margin-top:2px}
.cv .yr{font-family:var(--mono);font-size:12px;color:var(--t-coral);letter-spacing:.04em}
.cv ul{margin:8px 0 0;padding-left:18px;display:grid;gap:4px;font-size:15px}
.cv p{margin:6px 0 0;font-size:15px}
.cvl{display:grid;gap:18px;margin-top:16px;border-left:3px solid var(--line);padding-left:18px}
.cvl>div{position:relative}
.cvl>div::before{content:"";position:absolute;left:-26px;top:4px;width:13px;height:13px;border-radius:50%;background:var(--surface);border:3px solid var(--t-blue)}
.cvl>div.now::before{background:var(--t-coral);border-color:var(--t-coral)}
.tags2{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tags2 span{background:var(--bg);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600}
.chip.go{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.go b{display:inline-block;animation:fly 2.6s ease-in-out infinite}
@keyframes fly{50%{transform:translate(5px,-3px)}}

/* stat tile */
.stat{display:flex;flex-direction:column;justify-content:space-between;padding:22px;cursor:default}
.stat:hover{transform:none}
.stat b{font-family:var(--display);font-size:68px;font-weight:800;line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.stat span{font-size:15px;font-weight:600;opacity:.9}

/* journey */
.journey{grid-column:1/-1;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:24px 24px 20px;overflow-x:auto}
.journey h2{font-size:14px;font-family:var(--mono);font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.jl{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:12px;position:relative;min-width:780px;margin-top:22px}
.jl::before{content:"";position:absolute;left:8px;right:8px;top:9px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--t-blue),var(--t-teal),var(--t-sun),var(--t-coral))}
.stop{position:relative;padding-top:34px}
.stop::before{content:"";position:absolute;top:0;left:0;width:22px;height:22px;border-radius:50%;background:var(--surface);border:4px solid var(--t-teal)}
.stop.now::before{background:var(--t-coral);border-color:var(--t-coral);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--t-coral) 50%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
.stop .yr{font-family:var(--mono);font-size:12px;color:var(--muted)}
.stop h3{font-size:14px;font-weight:700;margin-top:4px;line-height:1.25}
.stop p{margin:4px 0 0;font-size:13px;color:var(--muted)}

/* animations used in tile art */
.grow{transform-box:fill-box;transform-origin:bottom;animation:grow 2.4s ease-in-out infinite alternate}
@keyframes grow{from{transform:scaleY(.5)}}
.bob{transform-box:fill-box;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.dash{stroke-dasharray:6 9;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-30}}
.blink{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.orbit{transform-box:view-box;transform-origin:50% 50%;animation:spin 16s linear infinite}

/* sheet */
.modal{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,#000 55%,transparent);display:grid;place-items:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--surface);border-radius:28px;width:min(640px,100%);max-height:calc(100% - 8px);overflow:auto;padding:24px;animation:rise .35s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(28px) scale(.97)}}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.mhead h3{font-size:24px;font-weight:700}
.x{border:0;background:var(--bg);width:42px;height:42px;border-radius:50%;font-size:24px;cursor:pointer;flex:none}
.mnote{display:inline-block;margin:10px 0 18px;background:var(--soft-sun);font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;padding:4px 10px;border-radius:999px}
.step{font-size:15px;color:var(--muted);margin-bottom:10px}
.q{background:var(--bg);border-radius:16px;padding:14px;margin-bottom:10px}
.q b{display:block;margin-bottom:8px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 16px;cursor:pointer;font-weight:700;transition:transform .15s}
.opt:hover{transform:translateY(-2px)}
.opt.sel{border-color:var(--t-blue)} .opt.ok{border-color:var(--t-teal);background:var(--soft-teal)} .opt.no{border-color:var(--t-coral);background:var(--soft-coral)}
.big{border:0;background:var(--ink);color:var(--bg);font-weight:700;padding:12px 20px;border-radius:14px;cursor:pointer;margin-top:6px}
.big:disabled{opacity:.4;cursor:default}
.big.coral{background:var(--t-coral);color:#fff}
.score{font-family:var(--display);font-size:44px;font-weight:800;color:var(--t-teal);line-height:1}
.qbars{display:grid;gap:10px;margin-top:14px}
.qbar{display:grid;grid-template-columns:52px 1fr 48px;gap:10px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.qbar .t{height:16px;background:var(--bg);border-radius:999px;overflow:hidden}
.qbar .f{height:100%;width:0;border-radius:999px;background:var(--t-teal);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.qbar .f.low{background:var(--t-coral)}
.done{display:inline-flex;gap:6px;align-items:center;background:var(--soft-teal);color:var(--ink);font-weight:700;font-size:14px;padding:6px 12px;border-radius:999px;margin-top:14px}
.room{display:flex;flex-wrap:wrap;gap:10px;min-height:44px;margin:6px 0 14px}
.pav{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex:none}
.room .pav{animation:popin .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes popin{from{transform:scale(0)}}
.count{font-family:var(--display);font-weight:800;font-size:22px}
.lines{display:grid;gap:10px}
.lrow{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center}
.lrow .n{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#fff}
.lrow input{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.lrow input:focus{outline:none;border-color:var(--t-blue)}
.out{margin-top:16px;background:var(--ink);color:var(--bg);border-radius:16px;padding:16px;line-height:1.5}
.out .lab{font-family:var(--mono);font-size:11px;letter-spacing:.08em;opacity:.7;display:block;margin-bottom:6px}
.weeks{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:5px;margin:4px 0 8px}
.wk{aspect-ratio:1;border:0;border-radius:10px;cursor:pointer;font-weight:800;font-size:14px;color:var(--ink);transition:transform .15s;display:grid;place-items:center;padding:0}
.wk:hover{transform:translateY(-3px)} .wk.sel{outline:3px solid var(--ink);outline-offset:2px}
.wk.p1{background:var(--soft-blue)} .wk.p2{background:var(--soft-teal)} .wk.p3{background:var(--soft-sun)} .wk.cp{background:var(--t-coral);color:#fff}
.cyc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cy{background:var(--bg);border-radius:14px;padding:12px;display:grid;gap:4px;align-content:start}
.cy .cn{width:26px;height:26px;border-radius:8px;background:var(--t-teal);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.cy b{font-size:14px}
.cy p{margin:0;font-size:13px;color:var(--muted)}
@media (max-width:560px){.cyc{grid-template-columns:repeat(2,minmax(0,1fr))}}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);margin-bottom:14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.wkd{background:var(--bg);border-radius:16px;padding:16px}
.wkd .k{font-family:var(--mono);font-size:12px;color:var(--muted)}
.wkd b{font-family:var(--display);font-size:20px;display:block;margin:4px 0}
.wkd p{margin:0;font-size:15px;color:var(--muted)}
/* tracker */
.segs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.seg{border:1px solid var(--line);background:var(--bg);padding:6px 14px;border-radius:999px;cursor:pointer;font-size:14px}
.seg[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.people{display:grid;gap:8px}
.person{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 10px;border-radius:14px;background:var(--bg)}
.person .nm{font-weight:700;font-size:15px}
.person .sub{font-size:13px;color:var(--muted)}
.st{border:0;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:800;cursor:pointer;color:var(--ink)}
.st.booked{background:var(--soft-blue)} .st.attended{background:var(--soft-sun)} .st.done{background:var(--soft-teal)}
.trow{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:16px}
.ring{width:110px;height:110px;flex:none}
.ring circle{fill:none;stroke-width:14}
.ring .trk{stroke:var(--bg)} .ring .val{stroke:var(--t-teal);stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1);transform:rotate(-90deg);transform-origin:50% 50%}
.ring text{fill:var(--ink);font-family:var(--display);font-weight:800;font-size:24px}
.bud{flex:1;min-width:180px}
.bud .row{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.bud .bar{height:14px;border-radius:999px;background:var(--bg);overflow:hidden;margin-top:6px}
.bud .fill{height:100%;background:linear-gradient(90deg,var(--t-blue),var(--t-coral));border-radius:999px;transition:width .8s}
.toast{font-size:14px;font-weight:700;color:var(--t-teal);min-height:20px;margin-top:8px}
/* fit */
.fitg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fit{background:var(--bg);border-radius:18px;padding:14px;display:grid;gap:6px}
.fit .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff}
.fit .ic svg{width:22px;height:22px}
.fit b{font-family:var(--display);font-size:15px;font-weight:700}
.fit p{margin:0;font-size:14px;color:var(--muted)}
.letter p{margin:0 0 12px;font-size:15.5px}


.zone{margin-top:12px}
.zone+.zone{margin-top:36px}
.zhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 4px 14px}
.zhead h2{font-size:clamp(22px,3vw,30px);font-weight:800;letter-spacing:-.02em}
.zhead p{margin:0;color:var(--muted);font-size:15px}
.samples{background:var(--soft-teal);border-radius:34px;padding:22px 16px 16px}
.samples .zhead{margin-left:8px}
.badge{position:absolute;top:16px;left:18px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.9);color:#0e3d45;font-weight:500}
.tile.inkt .badge{background:var(--t-coral);color:#fff}


.intro{background:var(--bg);border-radius:18px;padding:14px 16px;margin-bottom:18px}
.intro p{margin:0;font-size:15.5px}
.feats{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.feats span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700;cursor:pointer}
.tab[aria-selected="true"]{background:var(--t-ink);color:#fff;border-color:var(--t-ink)}
.avb.taken{opacity:.3;filter:grayscale(1);cursor:not-allowed;transform:none}
.avs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:8px 0 12px}
.avb{aspect-ratio:1;border:2px solid var(--line);border-radius:16px;background:var(--bg);font-size:26px;cursor:pointer;display:grid;place-items:center;transition:transform .15s}
.avb:hover{transform:scale(1.08)}
.avb.sel{border-color:var(--t-teal);background:var(--soft-teal);transform:scale(1.08)}
.nameIn{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.stu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sc{background:var(--bg);border-radius:14px;padding:10px;display:grid;gap:4px;justify-items:start;border:2px solid transparent;transition:border-color .3s}
.sc .e{font-size:24px;line-height:1}
.sc b{font-size:14px}
.sc .s{font-size:12.5px;font-weight:700;color:var(--muted)}
.sc.ans .s{color:var(--t-coral)}
.sc.sub{border-color:var(--t-teal)}
.sc.sub .s{color:var(--t-teal)}
.sc.me{background:var(--soft-teal)}
.vbars{display:flex;align-items:flex-end;gap:10px;height:150px;margin-top:10px;border-bottom:2px solid var(--line);padding-bottom:2px}
.vb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:12px;font-variant-numeric:tabular-nums}
.vb i{display:block;width:100%;max-width:44px;border-radius:8px 8px 0 0;background:var(--t-teal);height:0;transition:height .9s cubic-bezier(.2,.8,.2,1)}
.vlab{display:flex;gap:10px;margin-top:4px}.vlab span{flex:1;text-align:center;font-size:12px;color:var(--muted)}
@media (max-width:560px){.avs{grid-template-columns:repeat(4,minmax(0,1fr))}.stu{grid-template-columns:repeat(2,minmax(0,1fr))}}

@media (max-width:900px){.bento{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-column:1/-1;grid-row:span 2}}
@media (max-width:560px){.bento{grid-template-columns:1fr;grid-auto-rows:210px}.c2,.hero{grid-column:auto}.hero{grid-row:span 2}.fitg{grid-template-columns:1fr}.stat b{font-size:56px}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}

/* ===== Direction A: quiet, Apple-like. White ground, grey cards, black line art, one teal accent for small details. ===== */
:root{
  --bg:#ffffff; --surface:#ffffff; --card:#f5f5f7; --ink:#1d1d1f; --muted:#6e6e73; --line:#e3e3e8; --accent:#0f766e;
  --t-teal:#0f766e; --t-blue:#6b9f98; --t-coral:#c2410c; --t-ink:#1d1d1f; --t-lilac:#c7c7cc; --t-sun:#f5f5f7;
  --soft-teal:#e6f1ef; --soft-blue:#f5f5f7; --soft-sun:#f5f5f7; --soft-coral:#fbe9e2;
  --display:"Geist","Helvetica Neue",Arial,sans-serif; --body:"Geist","Helvetica Neue",Arial,sans-serif; --mono:"Geist","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#161617; --card:#161617; --ink:#f5f5f7; --muted:#a1a1a6; --line:#2c2c2e; --accent:#3cc4b0;

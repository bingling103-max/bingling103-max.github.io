name = "lings-classroom"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# `npx wrangler d1 create lings-classroom` prints the database_id — paste it below.
[[d1_databases]]
binding = "DB"
database_name = "lings-classroom"
database_id = "PASTE_DATABASE_ID_HERE"

[vars]
# Where the student page is served from. Only these origins may post answers.
ALLOWED_ORIGINS = "https://bingling103-max.github.io"

<script>
/* ===== ESOL Engine v2 · core.js — FORMAT + CLASSROOM TOOLS + PLAN. No lesson logic lives here. =====
 Lesson API
   E.lesson({id,title,prefix,roster})           prefix = localStorage prefix, e.g. 'xd-psp2-'
   E.page({id,t,zh,st,main,min,html,init,css})  html()=>string · init(el) runs on every visit · main:true = in the default plan
   E.preset(id,name,zh,ids)                     Plan presets
   E.pics(IMG,SVG)                              IMG[id]=[中文说明,prompt,emoji,hint,主题·准确版本] · SVG[id]=svg string
   E.items([{k,w,pic,say}])                     words for game plugins

*/
const E=(()=>{
const $=(s,r)=>(r||document).querySelector(s),$$=(s,r)=>[...(r||document).querySelectorAll(s)];
const L={id:'lesson',title:'Lesson',prefix:'xd-v2-',roster:{GEN:['Student A','Student B','Student C']}};
const P=[];const PRE=[];let IMG={},SVG={},ITEMS=[];
const ls={get(k,d){try{const v=localStorage.getItem(L.prefix+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(L.prefix+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(L.prefix+k)}catch(e){}}};
let cur=0,hist=[],plan=null,hidden={},inited={};
const api={};
api.lesson=o=>{Object.assign(L,o)};
api.page=o=>{P.push(Object.assign({st:'',zh:'',main:false,min:3},o));return o};
api.preset=(id,name,zh,ids)=>PRE.push({id,name,zh,ids});
api.pics=(i,s)=>{IMG=i;SVG=s||{}};
api.items=a=>{ITEMS=a};
api.ls=ls;
// ---------- helpers ----------
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const shuffle=(a,seed)=>{a=a.slice();let s=seed==null?Math.random()*1e9|0:[...String(seed)].reduce((h,c)=>Math.imul(h^c.charCodeAt(0),16777619),2166136261)>>>0;const r=()=>(s=Math.imul(s^s>>>15,1|s)+0x6D2B79F5>>>0,((s^s>>>14)>>>0)/4294967296);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const HDR=(tag,title,zh,rt,cls)=>`<div class="hdr"><span class="tg ${cls||''}">${tag}</span><h2>${title}${zh?`<span class="zh">${zh}</span>`:''}</h2>${rt?`<div class="rt">${rt}</div>`:''}</div>`;
const SAY=(t,v)=>`<button class="say${v?' '+v:''}" data-say="${esc(String(t).replace(/<[^>]+>/g,''))}"${v?` data-v="${v}"`:''} title="Listen">🔊</button>`;
const REV=(t,blk)=>`<span class="rv${blk?' blk':''}">${t}</span>`;
let PICN=0;
const PIC=(id,o)=>{o=o||{};const s=IMG[id]||[];let src='';const up=ls.get('img-'+id,null);
 const inner=up?`<img src="${up}" alt="${esc(s[0]||id)}" data-img-subject="${esc(s[4]||'')}">`:SVG[id]?SVG[id].replace('<svg',`<svg role="img" aria-label="${esc(s[0]||id)}" data-img-subject="${esc(s[4]||'')}"`):`<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:48px">${s[2]||'🖼️'}<span style="font-size:14px;color:#888;margin-left:6px">${id}</span></div>`;
 return `<div class="pic" data-pic="${id}" style="${o.h?`height:${o.h}px;`:''}${o.w?`width:${o.w}px;`:''}${o.style||''}">${inner}${s[3]&&!o.nohint?`<button class="hint" data-hint title="Hint">💡</button><span class="htx">${esc(s[3])}</span>`:''}</div>`};
const TIMER=secs=>`<span class="row" style="gap:6px">${secs.map(s=>`<button class="btn go" data-timer="${s}">⏱ ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}</button>`).join('')}<span class="timer">—</span></span>`;
let CLASS=ls.get('class','GEN');
const NAMES=()=>L.roster[CLASS]||L.roster.GEN||[];
const clsBar=()=>`<span class="row" style="gap:4px">${Object.keys(L.roster).map(k=>`<button class="btn${CLASS===k?' on':''}" data-cls="${k}">👥 ${k==='GEN'?'General':k}</button>`).join('')}</span>`;
const PICK=lab=>`<span class="row" style="gap:6px"><button class="btn co" data-pick>🎯 ${lab||'Pick a student'}</button><b class="pickout acc t-l"></b></span>`;
Object.assign(window,{HDR,SAY,REV,PIC,TIMER,clsBar,PICK,esc,shuffle,NAMES});
Object.defineProperty(window,'CLASS',{get:()=>CLASS});
// ---------- sound ----------
let SFXON=ls.get('sfx',true),AC=null;
const ac=()=>{if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC};
function tone(c,type,f0,f1,dur,pk,t0){const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f0,t0);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t0+dur);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(pk,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g).connect(c.destination);o.start(t0);o.stop(t0+dur+.05)}
function noise(c,dur,f0,f1,pk,t0){const b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.setValueAtTime(f0,t0);f.frequency.exponentialRampToValueAtTime(f1,t0+dur);const g=c.createGain();g.gain.setValueAtTime(pk,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);s.connect(f).connect(g).connect(c.destination);s.start(t0)}
api.sfx=n=>{if(!SFXON)return;const c=ac();if(!c)return;const t=c.currentTime;
 ({ding:()=>{tone(c,'sine',1318,0,.35,.16,t);tone(c,'sine',1976,0,.3,.08,t+.06)},nope:()=>tone(c,'triangle',300,220,.18,.22,t),thump:()=>{tone(c,'sine',130,55,.2,.6,t);noise(c,.08,600,200,.25,t)},
  swish:()=>noise(c,.4,3000,700,.3,t),whoosh:()=>noise(c,.6,300,1600,.3,t),click:()=>tone(c,'square',2000,1600,.03,.12,t),sparkle:()=>[1568,2093,2637,3136].forEach((f,i)=>tone(c,'sine',f,0,.25,.12,t+i*.07)),
  tada:()=>[523,659,784,1047].forEach((f,i)=>tone(c,'triangle',f,0,.3,.16,t+i*.09)),flip:()=>noise(c,.15,2500,900,.2,t)}[n]||(()=>{}))()};
let VOICES=[];const loadV=()=>{try{VOICES=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))}catch(e){}};try{loadV();speechSynthesis.onvoiceschanged=loadV}catch(e){}

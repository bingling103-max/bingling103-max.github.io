<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Short Vowels · CVC Phonics</title>
<style>
:root{--fz:1;--bg:#fff8ec;--paper:#fff;--ink:#1f2633;--mute:#5b6272;--line:#f0dcb8;--gold:#f5b82e;--ok:#2f9a5b;--bad:#e0484d;
 --va:#e0484d;--ve:#2f9a5b;--vi:#2f6fb3;--vo:#7b4fc4;--vu:#e97a12;--f:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg) repeating-linear-gradient(90deg,transparent 0 79px,rgba(240,220,184,.35) 79px 80px);color:var(--ink);font-family:var(--f);font-size:calc(18px*var(--fz))}
button{font:inherit;cursor:pointer}
/* top bar */
#top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:3px solid var(--line);display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap}
#top h1{margin:0 8px 0 0;font-size:calc(20px*var(--fz));white-space:nowrap}
#tabs{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.tab{border:3px solid var(--line);background:#fff;border-radius:12px;padding:7px 12px;font-weight:800;white-space:nowrap;box-shadow:0 3px 0 var(--line)}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tools{display:flex;gap:4px}.tools button{border:0;background:#f1e6d2;border-radius:10px;padding:7px 10px;font-weight:800}
.tools button.on{background:var(--gold)}
main{max-width:1400px;margin:0 auto;padding:14px}
.mode{display:none}.mode.on{display:block;animation:fadeUp .3s}
h2{margin:4px 0 12px;font-size:calc(26px*var(--fz))}
h2 small{font-size:.6em;color:var(--mute);font-weight:600;margin-left:8px}
.card{position:relative;background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:10px;box-shadow:0 4px 0 var(--line);transition:transform .15s}
.pic{width:100%;aspect-ratio:240/150;border-radius:12px;overflow:hidden;display:block}
.pic svg{width:100%;height:100%;display:block}
.say{border:0;background:#ffe7c2;border-radius:50%;width:2.1em;height:2.1em;font-size:calc(17px*var(--fz));vertical-align:middle;flex:none}
.say:active{transform:scale(1.2)}
.w{font-weight:900;letter-spacing:.04em}
.v{border-radius:6px;padding:0 2px}
.va{color:var(--va)}.ve{color:var(--ve)}.vi{color:var(--vi)}.vo{color:var(--vo)}.vu{color:var(--vu)}
.bga{background:var(--va)}.bge{background:var(--ve)}.bgi{background:var(--vi)}.bgo{background:var(--vo)}.bgu{background:var(--vu)}
.bda{border-color:var(--va)!important}.bde{border-color:var(--ve)!important}.bdi{border-color:var(--vi)!important}.bdo{border-color:var(--vo)!important}.bdu{border-color:var(--vu)!important}
.zb{position:absolute;right:8px;top:8px;border:0;background:rgba(255,255,255,.9);border-radius:50%;width:34px;height:34px;box-shadow:0 1px 3px rgba(0,0,0,.2);z-index:2}
body.notext .tx{visibility:hidden}
body.notext .txh::after{content:"say it! 🗣️";visibility:visible;position:absolute;left:0;right:0;text-align:center;color:var(--mute)}
.txh{position:relative}
/* overview */
.cols{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media (max-width:900px){.cols{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.cols{grid-template-columns:1fr}}
.col{border-width:4px}
.colh{display:flex;align-items:center;gap:8px;color:#fff;border-radius:12px;padding:6px 10px;margin-bottom:8px}
.colh .big{font-size:calc(40px*var(--fz));font-weight:900;line-height:1}
.colh .say{background:rgba(255,255,255,.85)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mi{border:2px solid var(--line);border-radius:12px;padding:4px;text-align:center;background:#fff;cursor:pointer}
.mi .w{font-size:calc(20px*var(--fz))}
/* one by one */
.one{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:stretch}
@media (max-width:820px){.one{grid-template-columns:1fr}}
.boxes{display:flex;gap:10px;justify-content:center;margin:10px 0}
.bx{width:calc(84px*var(--fz));height:calc(96px*var(--fz));border:4px dashed #cfc3ad;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:calc(56px*var(--fz));font-weight:900;color:#cfc3ad;background:#fff;cursor:pointer;transition:all .2s}
.bx.lit{border-style:solid;color:var(--ink);border-color:var(--ink);animation:popIn .3s}
.bx.lit.vow{color:#fff}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.dot{width:46px;border:2px solid var(--line);border-radius:8px;padding:1px;background:#fff;cursor:pointer}.dot.on{border-color:var(--ink);transform:translateY(-3px)}
.fil{display:flex;gap:6px;flex-wrap:wrap}
.fb{border:3px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-weight:900}
.fb.on{color:#fff}
/* quiz */
.qwrap{max-width:860px;margin:0 auto;text-align:center}
.qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800}
.stars{font-size:calc(22px*var(--fz));letter-spacing:2px}
.big-say{font-size:calc(40px*var(--fz));width:3em;height:3em;border-radius:50%;border:0;background:#ffe7c2;box-shadow:0 5px 0 #f0cf98}
.vbtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.vb{width:calc(96px*var(--fz));height:calc(96px*var(--fz));border:0;border-radius:20px;color:#fff;font-size:calc(52px*var(--fz));font-weight:900;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.vb:active{transform:scale(1.15)}
.ok{animation:popIn .35s;outline:5px solid var(--ok)!important;outline-offset:3px}
.no{animation:shake .4s;outline:5px solid var(--bad)!important;outline-offset:3px}
.qpic{max-width:520px;margin:0 auto}
.slot{display:inline-flex;gap:8px;margin:12px 0;font-size:calc(64px*var(--fz));font-weight:900}
.slot span{min-width:1.1em;border-bottom:6px solid var(--ink);text-align:center;line-height:1.1}
.slot .gap{color:#cfc3ad}
.tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.tl{width:calc(70px*var(--fz));height:calc(70px*var(--fz));border:3px solid var(--line);border-radius:14px;background:#fff;font-size:calc(40px*var(--fz));font-weight:900;box-shadow:0 4px 0 var(--line)}
.tl.used{opacity:.25}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
.btn{border:3px solid var(--ink);background:#fff;border-radius:12px;padding:8px 16px;font-weight:900}
.btn.co{background:var(--ink);color:#fff}
.done{font-size:calc(30px*var(--fz));font-weight:900;margin:20px 0}
/* games */
.gtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:640px){.g4{grid-template-columns:repeat(3,1fr)}}
.mem{height:calc(120px*var(--fz));display:flex;align-items:center;justify-content:center;cursor:pointer;background:repeating-linear-gradient(45deg,#ffe7c2 0 12px,#fff3dd 12px 24px);font-size:calc(34px*var(--fz))}
.mem.open,.mem.got{background:#fff}.mem.got{border-color:var(--ok)}
.mem .pic{height:100%;width:auto;max-width:100%}
.bins{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}
@media (max-width:640px){.bins{grid-template-columns:repeat(3,1fr)}}
.bin{min-height:calc(150px*var(--fz));border-width:4px;cursor:pointer}
.bin .lab{color:#fff;border-radius:10px;font-weight:900;text-align:center;font-size:calc(30px*var(--fz))}
.bin .got{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{border:2px solid var(--line);border-radius:999px;padding:2px 10px;font-weight:900;background:#fff}
.wpool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wp{border:3px solid var(--line);background:#fff;border-radius:12px;padding:6px 14px;font-weight:900;font-size:calc(24px*var(--fz))}
.wp.sel{outline:4px solid var(--gold)}.wp.used{opacity:.2;pointer-events:none}
.flash{max-width:620px;margin:0 auto;height:calc(360px*var(--fz));max-height:60vh;display:flex;align-items:center;justify-content:center;font-size:80px}
/* zoom */
#zoom{position:fixed;inset:0;background:rgba(20,24,32,.6);z-index:50;display:none;align-items:center;justify-content:center}
#zoom.on{display:flex}
#zoom .zc{width:min(92vw,900px);max-height:90vh;overflow:auto;animation:popIn .25s}
.tip{background:#fff1d6;border:2px dashed #e9c98d;border-radius:12px;padding:8px 12px;font-size:.85em;color:#5b4a2a;margin-top:10px}
/* new features */
body.nozh .zh{display:none!important}
.zh{font-size:.8em;color:var(--mute);font-weight:600}
.zb{position:absolute;right:6px;top:6px;border:0;background:rgba(255,255,255,.92);border-radius:50%;width:32px;height:32px;box-shadow:0 1px 3px rgba(0,0,0,.25);z-index:3;opacity:0;transition:opacity .15s;font-size:15px;padding:0}
.card:hover>.zb,.pic:hover>.zb,.mi:hover>.zb,.zoomed>.zb,.zb:focus-visible{opacity:.95}
@media (hover:none){.zb{opacity:.85}}
.pic{position:relative}.mi{position:relative}
.zoomed{position:relative;z-index:60!important;transition:transform .35s ease;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.zoomed>.zb{transform:scale(var(--zi,1));transform-origin:top right}
#zdim{position:fixed;inset:0;background:rgba(20,24,32,.6);z-index:50;display:none}#zdim.on{display:block}
.card>.zb,.mi>.zb{top:auto;bottom:6px}.pic>.zb{top:6px;bottom:auto}
body.picnum .pic::after{content:attr(data-n);position:absolute;left:6px;bottom:6px;background:var(--bad);color:#fff;font:800 14px/1 var(--f);padding:4px 7px;border-radius:6px;z-index:2}
.xh{visibility:hidden!important}body.showhid .xh{visibility:visible!important;outline:3px dashed var(--bad);opacity:.45}
.hl{outline:5px solid var(--gold)!important;outline-offset:2px;transform:translateY(-3px)}
.rv{cursor:pointer;border-radius:8px;position:relative;display:inline-block;padding:0 6px}
.rv:not(.open){color:transparent!important;background:repeating-linear-gradient(135deg,#ece6d8 0 10px,#f4efe4 10px 20px);user-select:none}
.rv:not(.open) *{visibility:hidden}.rv:not(.open)::before{content:"👆 sentence";color:#8a8170;position:absolute;left:8px;font-size:.8em;top:50%;transform:translateY(-50%)}
.sent{font-size:calc(28px*var(--fz));font-weight:700;text-align:center}
mark{background:none;font-weight:900;text-decoration:underline 4px;text-underline-offset:6px}
mark.va{color:var(--va)}mark.ve{color:var(--ve)}mark.vi{color:var(--vi)}mark.vo{color:var(--vo)}mark.vu{color:var(--vu)}
/* drill looks */
.drl .pic{overflow:hidden;touch-action:none}
.look-sil .pic svg *{fill:#1a1a1c!important;stroke:#1a1a1c!important}.look-sil .pic .env{display:none}
.look-blur .pic svg{filter:blur(14px) grayscale(.6)}
.look-zoom .pic{cursor:grab}.look-zoom .pic svg{transform:scale(2.8)}
.ringw{position:relative;width:90px;height:90px;display:inline-block}.ring{width:90px;height:90px;transform:rotate(-90deg)}
.rbg{fill:none;stroke:#eee2cc;stroke-width:9}.rfg{fill:none;stroke:#2f9a5b;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .1s linear}
.rt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px}
.rt.beat{animation:beat .4s}@keyframes beat{50%{transform:scale(1.5);color:var(--bad)}}
.hints{display:flex;gap:6px;flex-wrap:wrap}
/* sentence mode */
.frame{background:var(--ink);color:#fff;border-radius:14px;padding:8px 18px;font-weight:900;font-size:calc(26px*var(--fz))}
.sbig{font-size:calc(46px*var(--fz));font-weight:800;text-align:center;filter:blur(14px);transition:filter .4s;cursor:pointer;user-select:none}.sbig.open{filter:none}
.say.big2{width:3em;height:3em;font-size:calc(24px*var(--fz))}
/* modal + confetti */
#modal{position:fixed;inset:0;background:rgba(20,24,32,.6);z-index:70;display:none;align-items:center;justify-content:center}#modal.on{display:flex}
.mbox{width:min(92vw,460px)}.mbox textarea{width:100%;font:inherit;border:2px solid var(--line);border-radius:10px;padding:8px;margin-bottom:10px}
.conf{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}.conf i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
body.nofx *{animation:none!important;transition:none!important}
@keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

 const tone=(f,d,dl,type)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+dl);g.gain.exponentialRampToValueAtTime(.15,t+dl+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dl+d);o.connect(g).connect(AC.destination);o.start(t+dl);o.stop(t+dl+d+.05)};
 ({ding:()=>{tone(1318,.3,0);tone(1976,.25,.06)},nope:()=>tone(220,.2,0,'triangle'),flip:()=>tone(900,.06,0,'square'),tada:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.3,i*.09,'triangle')),pop:()=>tone(700,.08,0),swish:()=>{tone(500,.12,0,'sine');tone(900,.1,.05,'sine')}}[n]||(()=>{}))()}catch(e){}}

// ===== 📋 All =====

 <div style="max-width:150px;margin:0 auto 8px">${PIC(VS[v].an)}</div><div class="mini">${WL[v].map(w=>`<div class="mi" data-mw="${w}">${PIC(w)}<div class="txh"><span class="tx">${WD(w,v)}</span></div></div>`).join('')}</div></div>`).join('')}</div>

 <div class="dots">${L.map((x,k)=>`<div class="dot nozoom${k===ONE.i?' on':''}" data-dot="${k}">${PIC(x.w)}</div>`).join('')}</div>`}

// ===== quizzes (10 per round) =====
const QZ={};

 if(q.n>=10){el.innerHTML=`<div class="qwrap card"><div class="done">${q.stars>=8?'🏆':q.stars>=5?'🎉':'💪'} ${q.stars} / 10</div><div class="stars" style="font-size:40px">${'⭐'.repeat(q.stars)}</div><div class="row" style="margin:16px"><button class="btn co" data-again="${kind}">🔁 Again</button></div></div>`;sfx('tada');confetti();return}
 const it=q.list[q.n];
 if(kind==='vow')el.innerHTML=`<div class="qwrap">${quizTop(kind,'👂 Which vowel?','听整词，选中间的元音')}<div class="card"><button class="big-say" data-say="${it.w}">🔊</button>
  <div class="qpic" style="max-width:320px;margin-top:10px;${q.show?'':'visibility:hidden'}" id="vpic">${PIC(it.w)}<div class="w" style="font-size:40px">${WD(it.w,it.v)}</div></div>
  <div class="vbtns">${VK.map(v=>`<button class="vb bg${v}" data-ans="${v}">${v}</button>`).join('')}</div></div></div>`;

 if(kind==='spell'){const extra=shuffle('abcdefghilmnoprstuvwxz'.split('').filter(c=>!it.w.includes(c))).slice(0,3);if(!q.tiles)q.tiles=shuffle([...it.w,...extra]);

function gSort(b,lv){const n=[8,12,20][lv-1];const pool=shuffle(WORDS).slice(0,n);let sel=null,left=n;
 b.innerHTML=`<div class="wpool">${pool.map((x,k)=>`<button class="wp" data-wp="${k}">${x.w}</button>`).join('')}</div><div class="bins">${VK.map(v=>`<div class="card bin bd${v}" data-bin="${v}"><div class="lab bg${v}">${v}</div><div class="got"></div></div>`).join('')}</div>`;
 b.onclick=e=>{let a;if(a=e.target.closest('[data-wp]')){$$('.wp',b).forEach(x=>x.classList.remove('sel'));a.classList.add('sel');sel=a;sfx('pop');return}
  if((a=e.target.closest('[data-bin]'))&&sel){const x=pool[+sel.dataset.wp];if(a.dataset.bin===x.v){$('.got',a).insertAdjacentHTML('beforeend',`<span class="chip">${WD(x.w,x.v)}</span>`);sel.classList.add('used');sel.classList.remove('sel');sel=null;sfx('ding');if(--left===0){setTimeout(()=>sfx('tada'),300);confetti()}}else{a.classList.add('no');sfx('nope');setTimeout(()=>a.classList.remove('no'),450)}}}}
function gFlash(b,lv){const ms=[1500,800,400][lv-1];let o=shuffle(WORDS),i=-1;
 const draw=s=>{const it=o[(i+o.length)%o.length];b.innerHTML=`<div class="card flash">${s&&i>=0?`<div style="width:100%">${PIC(it.w)}</div>`:'⚡'}</div><div class="row" style="margin-top:12px"><button class="btn co" data-fl>⚡ Flash</button><button class="btn" data-fa>👀 Answer</button><b class="fa" style="font-size:34px"></b></div>`};
 b.onclick=e=>{if(e.target.closest('[data-fl]')){i++;draw(1);sfx('flip');setTimeout(()=>draw(0),ms)}if(e.target.closest('[data-fa]')&&i>=0){const it=o[i%o.length];$('.fa',b).innerHTML=WD(it.w,it.v)+' '+SAY(it.w)}};draw(0)}
// ===== sentences (decodable: CVC words + the / a / is / on / in / I / can / see / has / my) =====
const SENT={cat:'The cat is on the mat.',hat:'It is a red hat.',bag:'The bag is big.',map:'I can see a map.',fan:'The fan is on.',van:'The van is red.',
 bed:'The dog is on the bed.',hen:'The hen is in the pen.',pen:'It is a red pen.',net:'The bug is in the net.',leg:'Tap your leg.',web:'The bug is on the web.',
 pig:'The pig is big.',pin:'It is a red pin.',lid:'Put the lid on the pot.',six:'I can see six cups.',bin:'The can is in the bin.',zip:'Zip up the bag.',
 dog:'The dog can run.',box:'The fox is in the box.',pot:'The pot is hot.',fox:'The fox is red.',log:'The dog sat on the log.',mop:'Mum has a mop.',
 sun:'The sun is hot.',bus:'I get on the bus.',cup:'I can see a cup.',bug:'The bug is on the rug.',mug:'Mum has a big mug.',nut:'The nut is in the cup.'};
const SENTH=it=>SENT[it.w].replace(new RegExp('\\b'+it.w+'\\b'),`<mark class="v${it.v}">${it.w}</mark>`);
const REV=h=>`<span class="rv">${h}</span>`;
// ===== in-place magnifier: every card and picture gets 🔍; zoomed things stay clickable =====
let ZEL=null,HOV=null;
function unzoom(){if(!ZEL)return;ZEL.style.transform='';ZEL.classList.remove('zoomed');ZEL=null;$('#zdim').classList.remove('on')}
function zoomEl(x){if(ZEL===x){unzoom();return}unzoom();const r=x.getBoundingClientRect();const s=Math.min(innerWidth*.92/r.width,innerHeight*.86/r.height,3.4);
 const dx=innerWidth/2-(r.left+r.width/2),dy=innerHeight/2-(r.top+r.height/2);x.classList.add('zoomed');x.style.setProperty('--zi',1/s);x.style.transform=`translate(${dx}px,${dy}px) scale(${s})`;ZEL=x;$('#zdim').classList.add('on');sfx('swish')}
function deco(){const m=$('.mode.on');if(!m)return;let n=0;
 $$('.card:not(.nozoom):not(.mem),.pic:not(.nozoom),.mi',m).forEach(x=>{if(x.closest('.dot')||x.closest('.mem'))return;if(!x.querySelector(':scope>.zb'))x.insertAdjacentHTML('beforeend','<button class="zb" data-zoom title="Zoom (F)">🔍</button>')});
 $$('.pic',m).forEach(p=>{if(!p.closest('.dot'))p.dataset.n=++n})}
let decoT=0;new MutationObserver(()=>{clearTimeout(decoT);decoT=setTimeout(deco,30)}).observe(document.documentElement,{childList:true,subtree:true});
document.addEventListener('click',e=>{const a=e.target.closest('[data-zoom]');if(!a)return;e.stopPropagation();e.preventDefault();zoomEl(a.parentElement)},true);
document.addEventListener('mouseover',e=>{const c=e.target.closest('.card,.mi,.pic');if(c&&!c.closest('.dot'))HOV=c});
// ===== right-click hides any card / picture / line (🙈 shows hidden things) =====
document.addEventListener('contextmenu',e=>{const m=e.target.closest('main');if(!m)return;e.preventDefault();const x=e.target.closest('.card,.mi,.pic,.btn,.row,.sent,h2,.boxes')||e.target;x.classList.toggle('xh')});
// ===== reveal =====
document.addEventListener('click',e=>{const a=e.target.closest('.rv');if(!a||e.target.closest('.say'))return;a.classList.toggle('open');sfx('pop')});
// ===== speak a list one by one (领读) =====
function sayList(list,onEach,done){let i=0;try{speechSynthesis.cancel()}catch(e){}const nx=()=>{if(i>=list.length){done&&done();return}const t=list[i];onEach&&onEach(i);i++;
 try{const u=new SpeechSynthesisUtterance(t);const v=VO.find(v=>/en-NZ/i.test(v.lang))||VO.find(v=>/en-AU/i.test(v.lang))||VO.find(v=>/en-GB/i.test(v.lang))||VO[0];if(v)u.voice=v;u.rate=.82;u.onend=()=>setTimeout(nx,350);speechSynthesis.speak(u)}catch(e){}};nx()}
document.addEventListener('click',e=>{const a=e.target.closest('[data-readall]');if(!a)return;e.stopPropagation();const v=a.dataset.readall;const col=a.closest('.col');const its=$$('.mi',col);
 sayList(WL[v],i=>{its.forEach(x=>x.classList.remove('hl'));its[i]&&its[i].classList.add('hl')},()=>its.forEach(x=>x.classList.remove('hl')))},true);
// ===== names + 🎯 pick a student =====
let NAMES=['Student A','Student B','Student C','Student D','Student E','Student F','Student G','Student H'];try{const n=JSON.parse(localStorage.getItem('sv-names')||'null');if(n&&n.length)NAMES=n}catch(e){}
const PICK=()=>`<span class="row" style="gap:6px"><button class="btn" data-pick>🎯 Pick</button><b class="pickout"></b></span>`;
document.addEventListener('click',e=>{const a=e.target.closest('[data-pick]');if(!a)return;const o=a.parentElement.querySelector('.pickout');let k=0;const t=setInterval(()=>{o.textContent='🎯 '+NAMES[Math.floor(Math.random()*NAMES.length)];sfx('flip');if(++k>8){clearInterval(t);sfx('ding')}},90)});
function editNames(){const m=$('#modal');m.innerHTML=`<div class="card mbox"><h2>👥 Student names <small class="zh">一行一个名字</small></h2><textarea id="nm" rows="9">${NAMES.join('\n')}</textarea><div class="row"><button class="btn co" data-nsave>Save</button><button class="btn" data-nclose>Close</button></div></div>`;m.classList.add('on')}
document.addEventListener('click',e=>{if(e.target.closest('[data-nsave]')){NAMES=$('#nm').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!NAMES.length)NAMES=['Student A'];try{localStorage.setItem('sv-names',JSON.stringify(NAMES))}catch(x){}$('#modal').classList.remove('on')}
 if(e.target.closest('[data-nclose]')||e.target.id==='modal')$('#modal').classList.remove('on');if(e.target.id==='zdim')unzoom()});
// ===== confetti =====
function confetti(){if(document.body.classList.contains('nofx'))return;const box=document.createElement('div');box.className='conf';box.innerHTML=Array.from({length:36},()=>`<i style="left:${Math.random()*100}%;animation-delay:${Math.random()*.6}s;background:${['#e0484d','#2f9a5b','#2f6fb3','#7b4fc4','#e97a12','#f5b82e'][Math.floor(Math.random()*6)]}"></i>`).join('');document.body.appendChild(box);setTimeout(()=>box.remove(),2600)}
// ===== 🖼️ Drill: see the picture → say the word (silhouette / zoom / blur · ring timer · layered hints) =====
const DR={i:0,look:'normal',t:0,step:0,order:WORDS};
let RING=null;function stopRing(){if(RING){clearInterval(RING);RING=null}}
function renderDrill(){stopRing();const it=DR.order[DR.i%DR.order.length];const hint=[`starts with <b>${it.w[0]}</b>`,`vowel: <b class="v${it.v}">${it.v}</b>`,WD(it.w,it.v)];
 $('#m-drill').innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">🖼️ Picture drill <small>${DR.i%DR.order.length+1} / ${DR.order.length}</small> <small class="zh">看图说词 · 剪影 / 放大 / 模糊 / 倒计时</small></h2>
 <span class="row">${[['normal','🖼️ Normal'],['sil','⬛ Shadow'],['zoom','🔍 Zoom in'],['blur','🌫️ Blur']].map(l=>`<button class="fb${DR.look===l[0]?' on':''}" style="${DR.look===l[0]?'background:var(--ink)':''}" data-look="${l[0]}">${l[1]}</button>`).join('')}</span></div>
 <div class="one"><div class="card bd${it.v} drl look-${DR.look}" data-main>${PIC(it.w)}</div>
 <div class="card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px">
  <div class="row"><span class="ringw"><svg viewBox="0 0 100 100" class="ring"><circle cx="50" cy="50" r="45" class="rbg"/><circle cx="50" cy="50" r="45" class="rfg" style="stroke-dasharray:283;stroke-dashoffset:0"/></svg><b class="rt">${DR.t||'—'}</b></span>
   <span class="row" style="gap:4px">${[0,3,5,10].map(t=>`<button class="fb${DR.t===t?' on':''}" style="${DR.t===t?'background:var(--ink)':''}" data-rt="${t}">${t?t+'s':'⏱ off'}</button>`).join('')}</span></div>
  <div class="row"><button class="btn" data-hint>💡 Hint</button><span class="hints">${hint.slice(0,DR.step).map(h=>`<span class="chip">${h}</span>`).join(' ')}</span></div>
  <div class="ans" style="font-size:calc(60px*var(--fz));min-height:1.3em">${DR.step>=4?`${WD(it.w,it.v)} ${SAY(it.w)}`:'🤔'}</div>
  <div class="sent">${DR.step>=4?`${SENTH(it)} ${SAY(SENT[it.w])}`:''}</div>
  <div class="row"><button class="btn co" data-dans>👀 Answer</button><button class="btn" data-dn="-1">◀</button><button class="btn co" data-dn="1">Next ▶</button><button class="btn" data-dn="r">🎲</button></div>${PICK()}</div></div>
 <div class="tip">Shadow → students guess the thing · Zoom in → drag the picture · then say the word and the sentence. <span class="zh">剪影先猜东西；放大可拖动；最后说词 + 说句子</span></div>`;
 if(DR.look==='zoom')dragZoom($('#m-drill .drl .pic'))}
function startRing(){stopRing();if(!DR.t)return;const el=$('#m-drill');const fg=$('.rfg',el),tx=$('.rt',el);let left=DR.t*10;const tot=left;
 RING=setInterval(()=>{left--;const f=left/tot;fg.style.strokeDashoffset=283*(1-f);fg.style.stroke=f>.5?'#2f9a5b':f>.25?'#f5b82e':'#e0484d';tx.textContent=Math.ceil(left/10);if(left<=30&&left%10===0){tx.classList.remove('beat');void tx.offsetWidth;tx.classList.add('beat');sfx('pop')}
  if(left<=0){stopRing();DR.step=4;renderDrill();sfx('tada')}},100)}
function dragZoom(p){if(!p)return;let tx=0,ty=0,sx,sy,dn=false;const sv=p.querySelector('svg');const ap=()=>sv.style.transform=`translate(${tx}px,${ty}px) scale(2.8)`;ap();
 p.onpointerdown=e=>{if(e.target.closest('.zb'))return;dn=true;sx=e.clientX-tx;sy=e.clientY-ty;p.setPointerCapture(e.pointerId)};p.onpointermove=e=>{if(!dn)return;tx=e.clientX-sx;ty=e.clientY-sy;ap()};p.onpointerup=()=>dn=false}
document.addEventListener('click',e=>{let a;const t=e.target;
 if(a=t.closest('[data-look]')){DR.look=a.dataset.look;renderDrill();return}
 if(a=t.closest('[data-rt]')){DR.t=+a.dataset.rt;renderDrill();startRing();return}
 if(a=t.closest('[data-hint]')){DR.step=Math.min(3,DR.step+1);renderDrill();sfx('pop');return}
 if(a=t.closest('[data-dans]')){DR.step=4;DR.look='normal';renderDrill();sfx('ding');return}
 if(a=t.closest('[data-dn]')){const d=a.dataset.dn;DR.i=d==='r'?Math.floor(Math.random()*DR.order.length):(DR.i+(+d)+DR.order.length)%DR.order.length;DR.step=0;renderDrill();if(DR.t)startRing();return}});
// ===== 🗣️ Sentences: picture → say a sentence (frame first, then the word's own sentence) =====
const FRAMES=['I can see a ___.','It is a ___.','This is my ___.'];
const SN={i:0,f:0,open:0,order:shuffle(WORDS)};
function renderSent(){const it=SN.order[SN.i%SN.order.length];const fr=SN.f<FRAMES.length?FRAMES[SN.f].replace('___',`<mark class="v${it.v}">${it.w}</mark>`):SENTH(it);const plain=fr.replace(/<[^>]+>/g,'');
 $('#m-sent').innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">🗣️ Say a sentence <small class="zh">看图 → 选句型 → 学生先说 → 点开核对</small></h2>
 <span class="row">${FRAMES.map((f,k)=>`<button class="fb${SN.f===k?' on':''}" style="${SN.f===k?'background:var(--ink)':''}" data-fr="${k}">${f}</button>`).join('')}<button class="fb${SN.f===3?' on':''}" style="${SN.f===3?'background:var(--ink)':''}" data-fr="3">⭐ Story sentence</button></span></div>
 <div class="one"><div class="card bd${it.v}" data-main>${PIC(it.w)}</div>
 <div class="card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px">
  <div class="frame">${SN.f<3?FRAMES[SN.f]:'Say the sentence 🗣️'}</div>
  <div class="sbig${SN.open?' open':''}" data-sopen>${fr}</div>
  <div class="row"><button class="btn" data-sopen>👀 Show</button><button class="say big2" data-say="${plain}">🔊</button></div>
  <div class="row"><button class="btn" data-sn="-1">◀</button><button class="btn co" data-sn="1">Next ▶</button><button class="btn" data-sn="r">🎲</button></div>${PICK()}</div></div>`}
document.addEventListener('click',e=>{let a;const t=e.target;
 if(a=t.closest('[data-fr]')){SN.f=+a.dataset.fr;SN.open=0;renderSent();return}
 if(a=t.closest('[data-sopen]')){SN.open=1;$('#m-sent .sbig').classList.add('open');sfx('pop');return}
 if(a=t.closest('[data-sn]')){const d=a.dataset.sn;SN.i=d==='r'?Math.floor(Math.random()*SN.order.length):(SN.i+(+d)+SN.order.length)%SN.order.length;SN.open=0;renderSent();return}});
// ===== events =====
document.addEventListener('click',e=>{const t=e.target;let a;
 if(a=t.closest('[data-say]')){e.stopPropagation();say(a.dataset.say);return}
 if(a=t.closest('[data-mw]')){say(a.dataset.mw);a.classList.add('hl');setTimeout(()=>a.classList.remove('hl'),700);return}
 if(a=t.closest('.tab[data-m]')){setMode(a.dataset.m);return}
 if(a=t.closest('[data-t]')){const n=a.dataset.t;if(n==='text'){document.body.classList.toggle('notext');a.classList.toggle('on')}if(n==='sfx'){SFX=!SFX;a.classList.toggle('on',SFX)}if(n==='m'||n==='p')fz(n==='p'?.1:-.1);if(n==='zh'){document.body.classList.toggle('nozh');a.classList.toggle('on')}if(n==='num'){document.body.classList.toggle('picnum');a.classList.toggle('on')}if(n==='hid'){document.body.classList.toggle('showhid');a.classList.toggle('on')}if(n==='fx'){document.body.classList.toggle('nofx');a.classList.toggle('on')}if(n==='names')editNames();if(n==='full'){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(x){}}return}
 // one
 if(a=t.closest('[data-f]')){ONE.f=a.dataset.f;ONE.i=0;renderOne();return}
 if(a=t.closest('[data-one]')){const d=a.dataset.one;ONE.i=d==='r'?Math.floor(Math.random()*oneList().length):ONE.i+(+d);renderOne();return}
 if(a=t.closest('[data-dot]')){ONE.i=+a.dataset.dot;renderOne();return}
 if(a=t.closest('[data-bx]')){lightBox(a);return}
 if(a=t.closest('[data-blend]')){$$('#m-one .bx').forEach((b,k)=>setTimeout(()=>lightBox(b),k*350));return}
 // quiz
 if(a=t.closest('[data-ans]')){answer(a.closest('.mode').id.slice(2),a.dataset.ans,a);return}
 if(a=t.closest('[data-tile]')){tile(+a.dataset.tile);return}
 if(a=t.closest('[data-clr]')){QZ.spell.fill=[];renderQuiz('spell');return}
 if(a=t.closest('[data-again]')){newRound(a.dataset.again);return}
 // games
 if(a=t.closest('[data-g]')){G.g=a.dataset.g;G.lv=1;renderGames();return}
 if(a=t.closest('[data-lv]')){G.lv=+a.dataset.lv;renderGames();return}});
function fz(d){const r=document.documentElement;const v=Math.max(.8,Math.min(1.8,(+getComputedStyle(r).getPropertyValue('--fz')||1)+d));r.style.setProperty('--fz',v.toFixed(2))}
document.addEventListener('keydown',e=>{if(/input|textarea/i.test(e.target.tagName))return;const k=e.key;
 if(k>='1'&&k<='8'){setMode(MODES[+k-1][0]);return}
 if(k==='Escape'){unzoom();$('#modal').classList.remove('on');return}
 if(k==='f'||k==='F'){const x=HOV&&document.contains(HOV)&&HOV.closest('.mode.on')?HOV:$('.mode.on [data-main]');if(x)zoomEl(x);return}
 if(k==='t'||k==='T'){$('[data-t="text"]').click();return}
 if(k==='-'){fz(-.1);return}if(k==='='){fz(.1);return}
 if(MODE==='one'&&(k==='ArrowRight'||k==='ArrowLeft')){ONE.i+=k==='ArrowRight'?1:-1;renderOne()}
 if(MODE==='drill'&&(k==='x'||k==='X')){DR.i=Math.floor(Math.random()*WORDS.length);DR.step=0;renderDrill();return}
 if(MODE==='drill'&&(k==='ArrowRight'||k==='ArrowLeft')){DR.i=(DR.i+(k==='ArrowRight'?1:-1)+WORDS.length)%WORDS.length;DR.step=0;renderDrill();return}
 if(MODE==='one'&&(k==='x'||k==='X')){ONE.i=Math.floor(Math.random()*oneList().length);renderOne()}});
function initApp(){$('#tabs').innerHTML=MODES.map(m=>`<button class="tab" data-m="${m[0]}">${m[1]}</button>`).join('');
 $('#app').innerHTML=MODES.map(m=>`<section class="mode" id="m-${m[0]}"></section>`).join('');
 if(innerWidth>1100)document.documentElement.style.setProperty('--fz','1.15');
 renderAll();renderOne();DR.order=shuffle(WORDS);renderDrill();renderSent();['vow','miss','spell'].forEach(newRound);renderGames();setMode('all')}
window.onload=()=>{try{initApp()}catch(e){console.error(e);document.body.insertAdjacentHTML('beforeend','<p style="color:red">Error: '+e.message+'</p>')}};

</script>

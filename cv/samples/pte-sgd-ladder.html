<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SGD 58 阶梯</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#EEF3F0;--panel:#FFFFFF;--panel2:#F6F9F7;--ink:#14302A;--muted:#5A6D67;--line:#D2DCD7;
  --accent:#1D6B58;--accent-ink:#FFFFFF;--accent-soft:#DCEDE6;--gold:#B7812A;--goldbg:#FBF1DC;
  --A:#C4553B;--B:#2F66A8;--C:#7550A3;--Abg:#FBE9E4;--Bbg:#E4EDF8;--Cbg:#EFE8F7;
  --ok:#23804F;--okbg:#E2F3E9;--bad:#B93A2C;--badbg:#FBE6E3;--shade:rgba(10,25,20,.55);
  --fs:19px;
  --f-disp:"Bricolage Grotesque","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0E1916;--panel:#15241F;--panel2:#1A2C26;--ink:#E4EEEA;--muted:#9BB0A8;--line:#2A3E37;
  --accent:#4DB292;--accent-ink:#06120E;--accent-soft:#1D3A30;--gold:#E0B35A;--goldbg:#2D2616;
  --A:#EE8C74;--B:#86AEE6;--C:#BA9BE2;--Abg:#35201B;--Bbg:#1A2940;--Cbg:#2A2139;
  --ok:#5CCB8C;--okbg:#15321F;--bad:#F08576;--badbg:#3A1C18;--shade:rgba(0,0,0,.7);}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0E1916;--panel:#15241F;--panel2:#1A2C26;--ink:#E4EEEA;--muted:#9BB0A8;--line:#2A3E37;
  --accent:#4DB292;--accent-ink:#06120E;--accent-soft:#1D3A30;--gold:#E0B35A;--goldbg:#2D2616;
  --A:#EE8C74;--B:#86AEE6;--C:#BA9BE2;--Abg:#35201B;--Bbg:#1A2940;--Cbg:#2A2139;
  --ok:#5CCB8C;--okbg:#15321F;--bad:#F08576;--badbg:#3A1C18;--shade:rgba(0,0,0,.7);}
html{font-size:var(--fs)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.5;font-size:1rem}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 60px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--f-disp);font-weight:800;font-size:1.15rem;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.brand .num{background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:0 8px;font-size:1rem}
.brand small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:.7rem}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:.8rem}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tools{display:flex;gap:6px;align-items:center;font-size:.75rem;color:var(--muted)}
.tools select,.tools button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 8px;font-size:.75rem;color:var(--ink)}

/* topics */
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:18px}
.tp{border:1.5px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 12px;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center}
.tp .ic{font-size:1.7rem;grid-row:span 2}
.tp b{font-size:.82rem;line-height:1.25}
.tp .meta{font-size:.68rem;color:var(--muted);display:flex;gap:8px}
.tp[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.lv{color:var(--gold);letter-spacing:1px}

/* ladder */
.ladder{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:18px 0 6px;align-items:end}
.rung{border:none;background:var(--panel);border-radius:10px 10px 4px 4px;padding:8px 6px 10px;text-align:left;border-bottom:4px solid var(--line);display:flex;flex-direction:column;gap:2px;min-height:64px}
.rung .n{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.rung .t{font-weight:700;font-size:.78rem;line-height:1.2}
.rung.done{border-bottom-color:var(--ok)}
.rung.done .n::after{content:" ✓";color:var(--ok)}
.rung[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.rung[aria-pressed="true"] .n{color:var(--bg);opacity:.75}
.rung:nth-child(1){min-height:56px}.rung:nth-child(2){min-height:66px}.rung:nth-child(3){min-height:76px}.rung:nth-child(4){min-height:86px}.rung:nth-child(5){min-height:96px}.rung:nth-child(6){min-height:106px}.rung:nth-child(7){min-height:116px}
.ladcap{font-size:.7rem;color:var(--muted);display:flex;justify-content:space-between}
@media (max-width:760px){.ladder{grid-template-columns:repeat(4,1fr)}.rung{min-height:56px!important}}

/* cards */
.stephead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:22px 0 10px}
.stephead h2{font-family:var(--f-disp);font-weight:800;font-size:1.6rem;margin:0;letter-spacing:-.02em;text-wrap:balance}
.stephead p{margin:0;color:var(--muted);font-size:.85rem;flex-basis:100%}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;position:relative}
.card h3{font-family:var(--f-disp);font-weight:700;margin:0 36px 8px 0;font-size:1.1rem;line-height:1.25}
.zbtn{position:absolute;top:10px;right:10px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;width:32px;height:32px;font-size:.85rem;line-height:1}
.card.zoomed{position:fixed;inset:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));z-index:100;overflow:auto;font-size:1.45em;box-shadow:0 0 0 100vmax var(--shade);padding:28px 32px}
.card.zoomed .zbtn{position:sticky;float:right;top:0;width:auto;padding:0 12px;height:38px}
.card.zoomed .zbtn::after{content:" 关闭"}
.sp{border-left:5px solid var(--sc);background:linear-gradient(90deg,var(--sbg),var(--panel) 60%)}
.sp.A{--sc:var(--A);--sbg:var(--Abg)}.sp.B{--sc:var(--B);--sbg:var(--Bbg)}.sp.C{--sc:var(--C);--sbg:var(--Cbg)}
.who{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.badge{display:inline-grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;background:var(--sc);color:#fff;font-family:var(--f-disp);font-weight:800;font-size:.9rem}
.A .badge,.badge.A{--sc:var(--A)}.B .badge,.badge.B{--sc:var(--B)}.C .badge,.badge.C{--sc:var(--C)}
.badge.A{background:var(--A)}.badge.B{background:var(--B)}.badge.C{background:var(--C)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1.5px solid var(--line);background:var(--panel2);border-radius:10px;padding:7px 14px;font-size:.85rem;font-weight:700}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.play{background:var(--goldbg);border-color:var(--gold);color:var(--ink)}
.btn.play.on{background:var(--gold);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.q{margin-top:12px}
.q .ql{font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:700}
.opts{display:grid;gap:6px}
.opt{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;text-align:left;font-size:.9rem}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opts.inline{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.fb{margin-top:8px;font-size:.85rem;padding:8px 12px;border-radius:10px;background:var(--panel2)}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.script{margin-top:10px;font-size:.92rem;background:var(--panel2);border-radius:10px;padding:10px 14px;border:1px dashed var(--line)}
.script mark{background:var(--goldbg);color:inherit;border-radius:3px;padding:0 2px}
.muted{color:var(--muted)}
.small{font-size:.78rem}
.en{font-size:1rem}
.phrase{font-family:var(--f-body);font-weight:700;background:var(--accent-soft);border-radius:8px;padding:6px 10px;display:inline-block}
.now{font-size:.8rem;color:var(--muted);min-height:1.4em}
.now b{color:var(--ink)}

/* notes */
.nbank{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;padding:10px;border:1px dashed var(--line);border-radius:12px;background:var(--panel2)}
.chip{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:700}
.chip.sel{border-color:var(--gold);background:var(--goldbg);box-shadow:0 0 0 3px var(--goldbg)}
.chip.ok{border-color:var(--ok);background:var(--okbg)}.chip.bad{border-color:var(--bad);background:var(--badbg)}
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
@media (max-width:760px){.boxes{grid-template-columns:1fr 1fr}}
.box{border:2px solid var(--line);border-radius:12px;min-height:130px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--panel);text-align:left}
.box.target{border-color:var(--gold)}
.box .bl{font-family:var(--f-disp);font-weight:800;font-size:.95rem;display:flex;justify-content:space-between;align-items:center}
.box.A .bl{color:var(--A)}.box.B .bl{color:var(--B)}.box.C .bl{color:var(--C)}
.box .bh{font-size:.68rem;color:var(--muted);font-weight:400;font-family:var(--f-body)}
.teacher{margin-top:12px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media (max-width:760px){.teacher{grid-template-columns:1fr}}
.teacher div{background:var(--goldbg);border-radius:10px;padding:8px 10px;font-family:var(--f-mono);font-size:.78rem;white-space:pre-line}
.teacher b{font-family:var(--f-disp);display:block;margin-bottom:2px}
.sym{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem}
.sym code{font-family:var(--f-mono);font-weight:700;background:var(--panel2);padding:1px 6px;border-radius:6px}

/* builder */
.sent{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.sent:first-of-type{border-top:none;margin-top:0;padding-top:0}
.slot{min-height:48px;border:2px dashed var(--line);border-radius:12px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;background:var(--panel2)}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--okbg)}
.slot.bad{border-color:var(--bad)}
.pool{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ck{border:1.5px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;font-size:.9rem}
.ck.used{visibility:hidden}
.sn{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);font-weight:700}

/* speak */
.frames{display:grid;gap:8px}
.frame{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;padding:10px 12px;border-radius:12px;background:var(--panel2)}
.frame .fl{font-family:var(--f-disp);font-weight:800;font-size:.8rem;color:var(--muted);padding-top:3px;min-width:4.2em}
.frame .ft{font-size:1.05rem;font-weight:700}
.frame .fh{grid-column:2;font-family:var(--f-mono);font-size:.78rem;color:var(--gold)}
.blank{display:inline-block;min-width:5em;border-bottom:2px solid var(--muted);height:1em}
.fade{display:flex;gap:6px;flex-wrap:wrap}
.timer{margin-top:12px;background:var(--panel2);border-radius:14px;padding:12px 14px}
.tbig{font-family:var(--f-mono);font-weight:700;font-size:2.2rem;line-height:1}
.tlab{font-size:.8rem;color:var(--muted)}
.bar{position:relative;height:16px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:8px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);width:0}
.bar .zone{position:absolute;top:0;bottom:0;left:58.33%;width:25%;background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(183,129,42,.35) 6px 12px)}
.barlab{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.65rem;color:var(--muted);margin-top:3px}
.chk{display:grid;gap:6px}
.ci{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:6px 10px;border-radius:10px;background:var(--panel2);font-size:.88rem}
.ci .sc{display:flex;gap:4px}
.ci .sc button{border:1.5px solid var(--line);background:var(--panel);border-radius:8px;width:2.2em;height:2em;font-family:var(--f-mono);font-weight:700}
.ci .sc button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.total{font-family:var(--f-mono);font-weight:700;font-size:1.3rem}
.pass{color:var(--ok)}.fail{color:var(--bad)}
.mnotes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media (max-width:760px){.mnotes{grid-template-columns:1fr}}
.mnotes label{font-family:var(--f-disp);font-weight:800;font-size:.85rem}
.mnotes textarea{width:100%;min-height:110px;border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--panel);color:var(--ink);font-family:var(--f-mono);font-size:.8rem;resize:vertical}
.model{font-size:1rem;line-height:1.7}
.model .s{border-radius:4px;padding:1px 0}
.upl{font-size:.8rem}
.upl input{font-size:.75rem;max-width:100%}
audio{max-width:100%;margin-top:6px}

/* guide */
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.score div{background:var(--panel2);border-radius:12px;padding:10px;text-align:center}
.score b{font-family:var(--f-mono);font-size:1.5rem;display:block}
.flow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.85rem}
.flow span{background:var(--panel2);border-radius:10px;padding:8px 10px;font-weight:700}
.flow em{font-style:normal;color:var(--muted)}
ul.clean{margin:6px 0 0;padding-left:1.1em}
ul.clean li{margin:4px 0}
.do li::marker{content:"✔ ";color:var(--ok)}
.dont li::marker{content:"✘ ";color:var(--bad)}
.bank .item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.bank .item:last-child{border-bottom:none}
.say{border:1px solid var(--gold);background:var(--goldbg);border-radius:8px;padding:3px 9px;font-size:.8rem;flex:none}
.pic{font-size:2.4rem;line-height:1}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s linear}}
</style>

<script>
/* ============ DATA ============ */
const TOPICS=[
{id:'jobs',lv:1,ic:'☕',zh:'大学生该不该打工',q:'Should university students have part-time jobs?',
 sp:[
 {k:'A',name:'Amy',g:'f',st:'for',zh:'支持：打工学到生活技能，还能赚房租。',
  text:"I think part-time jobs are good for university students. When I worked in a café, I learned how to talk to customers and how to manage my time. I also earned money for my rent, so I didn't need to ask my parents for help. For me, a job teaches real-life skills.",
  main:'Jobs teach real-life skills and give students money.',wrong:['Jobs are bad for students\' grades.','Students should work full-time.'],kw:['café','real-life skills','money for my rent']},
 {k:'B',name:'Ben',g:'m',st:'against',zh:'反对：打工时间太长会累，影响学习。',
  text:"I don't really agree. Many students work too many hours. Last year, my friend worked thirty hours a week, and he failed two courses. He was always tired in class. I think study should come first.",
  main:'Working too many hours can hurt students\' study.',wrong:['Students should find better jobs.','Café jobs are the best jobs.'],kw:['too many hours','failed two courses','tired']},
 {k:'C',name:'Chloe',g:'f',st:'solution',zh:'折中：限制每周10–15小时，学校多提供校内工作。',
  text:"I think you both have a point. A job can be useful, but students need a limit. Maybe ten to fifteen hours a week is enough. Universities could also offer more jobs on campus, so students don't waste time travelling.",
  main:'Students should work fewer hours, and universities could offer jobs on campus.',wrong:['Students should never work.','Students should travel to work.'],kw:['limit','ten to fifteen hours','jobs on campus']}],
 rel:{B:'disagree',C:'solution'},
 chips:[['part-time jobs?','T'],['+ real-life skills','A'],['money for rent','A'],['− too many hours','B'],['tired → failed','B'],['SOL limit 10–15 h','C'],['jobs on campus','C'],['useful, but balance','E']],
 notes:{T:'uni students + part-time jobs?',A:'+ café → skills,\n  time mgmt\n+ money for rent',B:'− too many hours\n→ tired, failed 2',C:'both OK, BUT limit\nSOL 10–15 h/wk\n+ jobs on campus',E:'useful, but\nstudy first / balance'},
 ans:["The speakers discussed|whether university students|should have|part-time jobs.",
      "The first speaker supported part-time jobs|because students can learn|real-life skills|and earn money for rent.",
      "However,|the second speaker disagreed|and said that working too many hours|can make students tired|and hurt their study.",
      "The third speaker|agreed with both speakers|and suggested|a limit of ten to fifteen hours a week|and more jobs on campus.",
      "Overall,|the discussion showed that|a part-time job can be useful,|but students need|a good balance."],
 zhAns:['话题','A 的观点+原因','B 反对 A','C 折中+办法','总结']},

{id:'phones',lv:1,ic:'📱',zh:'课堂上能不能用手机',q:'Should students be allowed to use phones in class?',
 sp:[
 {k:'A',name:'Jack',g:'m',st:'against',zh:'反对：学生总刷社交媒体，没法专心；老师收手机后大家更认真。',
  text:"In my opinion, phones should not be allowed in class. Students check social media all the time, so they can't focus on the lesson. Last term, our English teacher collected our phones at the start of every class. After that, everyone listened more carefully and joined the discussions.",
  main:'Phones stop students from focusing, so they should not be allowed.',wrong:['Phones help students join discussions.','Teachers should use more phones.'],kw:['social media','can\'t focus','collected our phones']},
 {k:'B',name:'Mia',g:'f',st:'for',zh:'支持：手机是学习工具（查词、拍白板），成年学生还要接紧急电话。',
  text:"I don't agree with a total ban. Phones are useful learning tools. We use them to look up new words, take photos of the whiteboard and check our timetable. Also, many adult students have children, so they need to answer calls in an emergency. A complete ban is too strict.",
  main:'Phones are useful learning tools, so a total ban is too strict.',wrong:['Phones are only for games.','Children should bring phones to class.'],kw:['learning tools','look up new words','emergency']},
 {k:'C',name:'Sam',g:'m',st:'solution',zh:'折中：问题不是手机，是怎么用；定清楚规则。',

const STANCE={for:'支持 ✔',against:'反对 ✘',partly:'部分同意，但有担心',solution:'看到两边，给出办法'};
const RELB={agree:'同意 A，并补充',disagree:'不同意 A',partly:'部分同意 A，但有担心'};

 disagree:'However, the second speaker disagreed and said that …',

 {n:'0',t:'认识题型',d:'这道题考什么、58 分要做到什么'},

/* ============ STATE ============ */
const S={view:'ladder',t:0,step:0,a1:{},a2:{},place:{},sel:null,chk3:false,build:{},pools:{},fade:0,showHint:true,scores:{},mockPlayed:false,showModel:false};
let PROG={};
try{PROG=JSON.parse(localStorage.getItem('sgd58')||'{}')||{}}catch(e){PROG={}}
function saveProg(){try{localStorage.setItem('sgd58',JSON.stringify(PROG))}catch(e){}}
function markDone(step){const id=T().id;PROG[id]=PROG[id]||{};if(!PROG[id][step]){PROG[id][step]=1;saveProg();renderLadder()}}
const T=()=>TOPICS[S.t];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ============ SPEECH (only on 🔊 press) ============ */
const synth=window.speechSynthesis;let VO={f:[],m:[]};let tok=0;let playingBtn=null;
function pickVoices(){if(!synth)return;const vs=synth.getVoices().filter(v=>/^en/i.test(v.lang));
 const pref=v=>(/en-(GB|AU|NZ)/i.test(v.lang)?0:1)+(/google|natural|online/i.test(v.name)?0:.5);
 vs.sort((a,b)=>pref(a)-pref(b));
 const fem=/female|samantha|karen|moira|tessa|serena|victoria|zira|libby|sonia|natasha|hazel|susan|fiona|kate|catherine|aria|jenny|emma|kathy|allison|ava|olivia|amy/i;
 const mal=/\bmale|daniel|alex\b|fred|david|ryan|william|guy|arthur|george|mark|oliver|thomas|james|lee|rishi|aaron|tom/i;
 const f=vs.filter(v=>fem.test(v.name)),m=vs.filter(v=>!fem.test(v.name)&&mal.test(v.name));
 const any=vs[0]||null;VO.f=[f[0]||any,f[1]||f[0]||any];VO.m=[m[0]||any,m[1]||m[0]||any];}
if(synth){pickVoices();synth.onvoiceschanged=pickVoices}
function voiceFor(topic,k){const sp=topic.sp;const i=sp.findIndex(s=>s.k===k);const g=sp[i].g;
 const nth=sp.slice(0,i).filter(s=>s.g===g).length;
 const base=g==='f'?1.08:0.88;return{v:(VO[g]||[])[nth%2],p:nth?base+(g==='f'?.14:-.08):base}}
function rate(){return parseFloat(document.getElementById('rate').value)||0.9}
function sentences(t){return t.match(/[^.!?]+[.!?]+["']?|[^.!?]+$/g)||[t]}
function stopAll(){tok++;if(synth)synth.cancel();if(playingBtn){playingBtn.classList.remove('on');playingBtn.textContent=playingBtn.dataset.label;playingBtn=null}setNow('')}
function setNow(h){document.querySelectorAll('.now').forEach(n=>n.innerHTML=h)}
function playQueue(items,btn,onDone){
 if(!synth){setNow('这个浏览器不支持朗读，请换 Chrome / Safari / Edge。');return}
 const was=btn&&btn===playingBtn;stopAll();if(was)return;
 const my=++tok;if(btn){playingBtn=btn;btn.dataset.label=btn.dataset.label||btn.textContent;btn.classList.add('on');btn.textContent='⏹ 停止'}
 const q=[];items.forEach(it=>sentences(it.text).forEach(s=>q.push({...it,text:s.trim()})));
 let i=0;const next=()=>{if(my!==tok)return;if(i>=q.length){if(btn){btn.classList.remove('on');btn.textContent=btn.dataset.label;playingBtn=null}setNow('');onDone&&onDone();return}
  const it=q[i++];const u=new SpeechSynthesisUtterance(it.text);if(it.v)u.voice=it.v;u.lang=(it.v&&it.v.lang)||'en-GB';u.pitch=it.p||1;u.rate=rate();
  if(it.label)setNow(it.label);u.onend=next;u.onerror=next;synth.speak(u)};
 next();}
function spItems(topic,keys){return keys.map(k=>{const s=topic.sp.find(x=>x.k===k);const vv=voiceFor(topic,k);return{text:s.text,v:vv.v,p:vv.p,label:`正在说：<span class="badge ${k}">${k}</span> <b>Speaker ${k}</b>`}})}
function sayText(text,btn){playQueue([{text,v:VO.f[0],p:1}],btn)}

 const f=[step0,step1,step2,step3,step4,step5,step6][S.step];el.innerHTML=head()+f();}

function step0(){return`<div class="grid g2">
 <div class="card">${zb()}<h3><span class="pic">🎧</span> 考试流程</h3>
  <div class="flow"><span>🎧 听 3 个人讨论<br><small class="muted">约 2.5–3 分钟 · 只播一次</small></span><em>→</em><span>⏱ 10 秒准备</span><em>→</em><span>🗣 最多 120 秒说</span></div>
  <p class="small muted">每场考试 2–3 题，同时算 <b>Listening</b> 和 <b>Speaking</b>。话题是大学、学习、社会这类学术讨论。</p></div>

  <p class="small muted">没有单独的语法分。内容最重要：<b>说对三个人 + 他们的关系</b>。流利 ≠ 说得快，是<b>不卡、不重复、不推翻重说</b>。</p></div>
 <div class="card">${zb()}<h3><span class="pic">🎯</span> 58 分目标：做到这 5 件事就够</h3>
  <ul class="clean do">

/* ============ TIMER ============ */
let TM={};
function tick(id){const el=document.getElementById(id);const st=TM[id];if(!el||!st)return;
 const now=(Date.now()-st.start)/1000;
 if(st.phase==='prep'){const left=Math.max(0,10-now);el.querySelector('[data-tb]').textContent='0:'+String(Math.ceil(left)).padStart(2,'0');el.querySelector('[data-tl]').textContent='⏱ 准备：看笔记，想好第一句';el.querySelector('[data-tbar]').style.width='0';
  if(left<=0){st.phase='speak';st.start=Date.now()}}
 else{const s=Math.min(120,now);el.querySelector('[data-tb]').textContent=Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
  el.querySelector('[data-tl]').textContent=s<70?'🗣 说！一直说下去':s<=100?'✔ 很好，可以准备 Overall 结尾':'⚠ 该结尾了';el.querySelector('[data-tbar]').style.width=(s/120*100)+'%';
  if(s>=120){stopTimer(id,'时间到')}}}
function startTimer(id){stopTimer(id);TM[id]={phase:'prep',start:Date.now()};TM[id].iv=setInterval(()=>tick(id),200);tick(id)}
function stopTimer(id,msg){const st=TM[id];if(st){clearInterval(st.iv);const el=document.getElementById(id);if(el&&st.phase==='speak'){const s=Math.min(120,(Date.now()-st.start)/1000);el.querySelector('[data-tl]').textContent=(msg||'说完了')+`：${Math.round(s)} 秒 `+(s<60?'· 有点短，每人加一个原因':s<=105?'· 长度正好':'· 很充分');}}delete TM[id]}

document.addEventListener('click',e=>{const b=e.target.closest('button,[data-box]');if(!b)return;const d=b.dataset;
 if(d.zoom!==undefined){const c=b.closest('.card');c.classList.toggle('zoomed');return}
 if(d.view){S.view=d.view;document.querySelectorAll('.tab[data-view]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.view===S.view));stopAll();render();return}
 if(d.topic!==undefined){S.t=+d.topic;S.sel=null;S.chk3=false;S.mockPlayed=false;stopAll();render();return}
 if(d.step!==undefined){S.step=+d.step;S.sel=null;stopAll();Object.keys(TM).forEach(k=>stopTimer(k));if(S.view!=='ladder'){S.view='ladder';document.querySelectorAll('.tab[data-view]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.view==='ladder'));render()}else{renderLadder();renderStep()}
   document.getElementById('ladder').scrollIntoView({behavior:'smooth',block:'start'});return}
 if(d.play){const t=T();playQueue(spItems(t,d.play==='all'?['A','B','C']:[d.play]),b);return}
 if(d.say!==undefined){sayText(d.say,b);return}
 if(d.sayall!==undefined){sayText(T().ans.map(s=>s.replace(/\|/g,' ')).join(' '),b);return}
 if(d.toggle){const x=document.getElementById(d.toggle);if(x)x.hidden=!x.hidden;return}
 if(d.a1){const t=T();const k=t.id+d.a1;S.a1[k]=S.a1[k]||{};if(S.a1[k][d.kind])return;S.a1[k][d.kind]=d.v;
   const zoomed=b.closest('.card').classList.contains('zoomed');renderStep();if(zoomed)reZoom(d.a1);
   if(t.sp.every(s=>{const a=S.a1[t.id+s.k]||{};return a.st&&a.m}))markDone(1);return}
 if(d.reset1!==undefined){T().sp.forEach(s=>{delete S.a1[T().id+s.k];delete S.pools['o'+T().id+s.k]});renderStep();return}
 if(d.a2){const t=T();S.a2[t.id]=S.a2[t.id]||{};if(S.a2[t.id][d.a2])return;S.a2[t.id][d.a2]=d.v;const zc=b.closest('.card').classList.contains('zoomed');renderStep();if(zc)zoomSel('.sp.'+d.a2);if(S.a2[t.id].B&&S.a2[t.id].C)markDone(2);return}
 if(d.reset2!==undefined){delete S.a2[T().id];renderStep();return}
 if(d.chip!==undefined){const i=+d.chip;const pl=S.place[T().id];const zc=isZ(b);if(pl[i]!==undefined&&b.closest('[data-box]')){delete pl[i];S.chk3=false;S.sel=null}else{S.sel=S.sel===i?null:i}renderStep();if(zc)zoomSel('#step .card');return}
 if(d.box&&S.sel!==null){S.place[T().id][S.sel]=d.box;S.sel=null;S.chk3=false;const zc=isZ(b);renderStep();if(zc)zoomSel('#step .card');return}
 if(d.check3!==undefined){S.chk3=true;const t=T(),pl=S.place[t.id];const zc=isZ(b);renderStep();if(zc)zoomSel('#step .card');if(t.chips.every((c,i)=>pl[i]===c[1]))markDone(3);return}
 if(d.reset3!==undefined){S.place[T().id]={};S.chk3=false;S.sel=null;delete S.pools['c'+T().id];renderStep();return}
 if(d.bld!==undefined){const k=T().id+d.bld;S.build[k]=S.build[k]||[];const j=+d.j;if(!S.build[k].includes(j))S.build[k].push(j);step4Re(b);return}
 if(d.unb!==undefined){const k=T().id+d.unb;S.build[k]=(S.build[k]||[]).filter(x=>x!==+d.j);step4Re(b);return}
 if(d.hint4!==undefined){const i=+d.hint4,k=T().id+i;let arr=S.build[k]||[];let p=0;while(p<arr.length&&arr[p]===p)p++;S.build[k]=arr.slice(0,p).concat([p]);step4Re(b);return}
 if(d.reset4!==undefined){T().ans.forEach((s,i)=>{delete S.build[T().id+i];delete S.pools['p'+T().id+i]});renderStep();return}
 if(d.fade!==undefined){S.fade=+d.fade;S.showHint=S.fade<2;rerenderKeep(b);return}
 if(d.hint!==undefined){S.showHint=!S.showHint;rerenderKeep(b);return}
 if(d.tstart){startTimer(d.tstart);return}
 if(d.tstop){stopTimer(d.tstop);return}
 if(d.sc){const sc=S.scores[d.sc]||(S.scores[d.sc]=[]);sc[+d.i]=+d.v;const card=b.closest('.card');const z=card.classList.contains('zoomed');
   card.querySelector('.chk').parentNode;const holder=document.createElement('div');holder.innerHTML=checkHTML(d.sc);
   const chk=card.querySelector('.chk');const row=chk.nextElementSibling;chk.replaceWith(holder.children[0]);row.replaceWith(holder.children[0]);
   if(sc.filter(x=>x!==undefined).length===6)markDone(d.sc==='c5'?5:6);return}
 if(d.mock!==undefined){if(S.mockPlayed)return;S.mockPlayed=true;b.disabled=true;const r=document.getElementById('rate');const old=r.value;r.value='1';
   playQueue(spItems(T(),['A','B','C']),null,()=>{r.value=old;b.textContent='已播放（考试只能听一次）';startTimer('t6')});
   setTimeout(()=>{b.textContent='🎧 正在播放…只播一次'},0);return}
 if(d.mockreset!==undefined){S.mockPlayed=false;stopAll();stopTimer('t6');delete S.scores.c6;renderStep();return}
 if(d.nexttopic!==undefined){S.t++;S.step=1;S.mockPlayed=false;S.sel=null;S.chk3=false;stopAll();render();window.scrollTo({top:0,behavior:'smooth'});return}
});
function isZ(b){const c=b.closest('.card');return c&&c.classList.contains('zoomed')}
function zoomSel(sel){const c=document.querySelector(sel);if(c)c.classList.add('zoomed')}
function reZoom(k){const c=document.querySelector('.sp.'+k);if(c)c.classList.add('zoomed')}
function step4Re(b){const z=isZ(b);const y=window.scrollY;renderStep();if(z)zoomSel('#step .card');window.scrollTo(0,y);if(T().ans.every((s,i)=>isBuilt(i)))markDone(4)}
function rerenderKeep(b){const cards=[...document.querySelectorAll('#step .card')];const zi=cards.findIndex(c=>c.classList.contains('zoomed'));
 // keep timer running: only rerender frames card
 const card=b.closest('.card');const tmp=document.createElement('div');tmp.innerHTML=step5();const fresh=tmp.querySelector('.card');card.replaceWith(fresh);if(zi===0)fresh.classList.add('zoomed')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.card.zoomed').forEach(c=>c.classList.remove('zoomed'))}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-box]')){e.preventDefault();e.target.click()}});
document.addEventListener('change',e=>{if(e.target.matches('[data-upload]')){const f=e.target.files&&e.target.files[0];if(!f)return;const box=e.target.parentNode.querySelector('[data-aud]');box.innerHTML='';const a=document.createElement('audio');a.controls=true;a.src=URL.createObjectURL(f);box.appendChild(a)}});
document.getElementById('stopall').onclick=stopAll;
let fs=19;try{fs=+localStorage.getItem('sgd58fs')||19}catch(e){}
function setFs(v){fs=Math.max(14,Math.min(28,v));document.documentElement.style.setProperty('--fs',fs+'px');try{localStorage.setItem('sgd58fs',fs)}catch(e){}}
document.getElementById('fsm').onclick=()=>setFs(fs-1);document.getElementById('fsp').onclick=()=>setFs(fs+1);setFs(fs);
render();
</script>

</body></html>

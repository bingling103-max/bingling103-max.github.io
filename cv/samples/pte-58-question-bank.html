<style>

:root[data-theme="dark"]{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;

.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{border:1px solid var(--line);background:var(--sheet);color:var(--fg);padding:7px 14px;border-radius:999px;font-weight:500}
.tab small{color:var(--muted);font-family:var(--f-mono);margin-left:4px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-selected="true"] small{color:inherit;opacity:.75}

.q:hover{background:var(--panel)}

.q .id{font-family:var(--f-mono);font-size:12.5px;color:var(--accent);padding-top:2px}
.q .t{font-weight:500;line-height:1.35;overflow-wrap:anywhere}
.q .m{grid-column:2;font-size:12px;color:var(--muted)}

.joint{font-weight:600;color:var(--accent)}

th{white-space:nowrap}

<script>
const DATA = {"rl": [{"id": "RL01", "title": "Formative Assessment", "week": "W1", "theme": "教育评价与学校制度", "level": "短", "opening": "直接宣告", "lecture": "Today I'd like to talk about formative assessment, which means checking students' learning during a course rather than only at the end. First, regular low-stakes quizzes help teachers see which ideas students have not understood yet, so lessons can be adjusted. Second, research suggests that students who receive frequent feedback tend to remember material for longer, because they are forced to recall information again and again. However, formative assessment is not free. Teachers need extra time to design tasks and mark them, and in large classes this workload can become unmanageable. Some schools solve this by using peer marking or short online quizzes that are marked automatically. As a result, the key question is not whether to use formative assessment, but how to make it sustainable for teachers. So, my conclusion is that small, frequent checks work best when schools also reduce other marking duties.", "words": 145, "topic": {"answer": "formative assessment", "how": "直接宣告型：第一句 \"Today I'd like to talk about formative assessment\" 已经把主题说出来，10 秒准备时直接写下即可。坑在于后半句定义 \"checking students' learning during a course\" 很长，别花时间把定义记全——记住主题词，把精力留给后面的 first / second / however。结尾 sustainable 也呼应主题。"}, "notes": {"candidates": ["formative assessment", "checking learning during a course"], "phrases": ["formative assessment", "during a course, not only at the end", "low-stakes quizzes", "∴ lessons can be adjusted", "frequent feedback", "remember material for longer", "≠ not free", "extra time to design and mark", "large classes, workload unmanageable", "peer marking / online quizzes", "∴ make it sustainable", "small, frequent checks + reduce marking duties"]}, "ans58": [["This lecture is mainly talking about", "formative assessment, and it means checking students' learning during a course."], ["Firstly,", "low-stakes quizzes show teachers which ideas students do not understand, so lessons can be adjusted."], ["Secondly,", "students who get frequent feedback remember material for longer."], ["Thirdly,", "teachers need extra time to design and mark tasks, which is hard in large classes."], ["Furthermore,", "some schools use peer marking or online quizzes."], ["In summary,", "formative assessment is useful, but it must be sustainable for teachers."]], "ans58Words": 81, "ans65": [["This lecture is mainly talking about", "formative assessment, {{which}} means checking learning during a course, not only at the end."], ["Firstly,", "low-stakes quizzes help {{because}} they show which ideas students have missed, {{so}} lessons can be adjusted."], ["Secondly,", "frequent feedback {{leads to}} longer memory, {{because}} students must recall information again and again."], ["Thirdly,", "{{although}} it works, teachers need extra time to design and mark tasks, especially in large classes."], ["Furthermore,", "some schools use peer marking or automatic online quizzes, {{which}} reduces the workload."], ["In summary,", "the key issue is sustainability, {{so}} frequent checks work best when other marking is reduced."]], "score58": {"content": {"est": "3–4", "why": "预估（按官方档位描述推断，非官方评分）：抓到主题、quizzes 的作用、feedback 与记忆、工作量这一转折，主线基本完整；但句子多是原词重组（low-stakes quizzes、frequent feedback 原样搬），因果只用 so 连接，\"because they are forced to recall\" 这层原因没讲出来，paraphrase 不足，到不了 5–6。"}, "pron": [{"w": "formative", "ipa": "/ˈfɔːmətɪv/", "tip": "重音在第一音节，别读成 for-MAY-tive"}, {"w": "assessment", "ipa": "/əˈsesmənt/", "tip": "重音在第二音节 -sess-，首音弱读"}, {"w": "unmanageable", "ipa": "/ʌnˈmænɪdʒəbl/", "tip": "-age- 读 /ɪdʒ/，不读 /eɪdʒ/"}, {"w": "sustainable", "ipa": "/səˈsteɪnəbl/", "tip": "重音在 -stain-，结尾 -able 弱读"}], "fluency": "Thirdly 句是转折，信息最多，容易停下来回想；先说 \"teachers need extra time\" 稳住，再补 large classes，不要回头改词。"}, "score65": {"content": {"est": "4–5", "why": "预估（按官方档位描述推断，非官方评分）：六句都把讲座里的真实关系说出来（quizzes→调整课程、feedback→记忆更久、although 引出工作量、which 说明解决办 : "sector", "ipa": "/ˈsektə/", "cn": "行业，领域"}]}, {"id": "RL08", "title": "Influencer Marketing", "week": "W8", "theme": "商业消费广告", "level": "中", "opening": "直接宣告", "lecture": "In this session, I'm going to explain why companies are moving their advertising budgets towards social media influencers. First, influencers offer trust. Surveys show that young consumers are more likely to believe a recommendation from a person they follow than a traditional television advert, because the influencer seems like a friend rather than a salesperson. Second, influencer marketing allows precise targeting. A small fitness brand, for example, can pay a creator with fifty thousand loyal followers instead of buying expensive national advertising, and these smaller creators often produce higher engagement rates. However, this trust is fragile. When followers discover that a post was paid for but not clearly labelled, they often feel deceived, and the brand's reputation can suffer. For this reason, regulators in several countries now require influencers to mark sponsored content clearly. As a result, honesty has become part of the business model. So, influencer marketing works best when the partnership is transparent and the product genuinely fits the creator's audience.", "words": 163, "topic": {"answer": "why companies are moving advertising budgets to influencer marketing", "how": "直接宣告：\"I'm going to explain why companies are moving their advertising budgets towards social media influencers\" 就是主题，而且带了 why，后面的 first / second 就是答案的原因。坑：只说 \"influencers\" 太空，要把 advertising budgets 和 why 带上；结尾 \"influencer marketing works best when…\" 呼应主题。"}, "notes": {"candidates": ["influencer marketing", "advertising budgets"], "phrases": ["advertising budgets → influencers", "influencers offer trust", "friend, not salesperson", "precise targeting", "small fitness brand, fifty thousand followers", "higher engagement rates", "≠ trust is fragile", "paid but not labelled ∴ feel deceived", "reputation can suffer", "regulators: mark sponsored content", "∴ honesty part of business model", "transparent + product fits audience"]}, "ans58": [["This lecture is mainly talking about", "why companies are moving their advertising budgets to social media influencers."], ["Firstly,", "influencers offer trust, because young consumers see them as friends."], ["Secondly,", "influencer marketing allows precise targeting, and smaller creators have higher engagement."], ["Thirdly,", "followers feel deceived when a paid post is not labelled, so the brand's reputation can suffer."], ["Furthermore,", "regulators now require influencers to mark sponsored content."], ["In summary,", "influencer marketing works best when partnerships are transparent."]], "ans58Words": 76, "ans65": [["This lecture is mainly talking about", "influencer marketing, {{which}} is attracting more of companies' advertising budgets."], ["Firstly,", "influencers build trust {{because}} young consumers see them as friends rather than salespeople."], ["Secondly,", "it allows precise targeting, {{so}} a small brand can pay a creator with loyal followers instead of national adverts."], ["Thirdly,", "{{although}} this trust is valuable, it is fragile {{because}} followers feel deceived by unlabelled paid posts."], ["Furthermore,", "this risk {{leads to}} rules on marking sponsored content, {{so}} honesty is now part of the business model."], ["In summary,", "it works best when partnerships are transparent and products fit the audience, {{because}} trust is fragile."]], "score58": {"content": {"est": "3–4", "why": "预估（按官方档位描述推断，非官方评分）：主题带上了 why，信任、精准投放、转折（未标注广告）、监管和结论都到位；但 precise targeting、higher engagement rates 是原词搬运，\"product fits the audience\" 这半个结论没说，估 3–4。"}, "pron": [{"w": "influencer", "ipa": "/ˈɪnfluənsə/", "tip": "重音在第一音节，不要读成 in-FLU-encer"}, {"w": "deceived", "ipa": "/dɪˈsiːvd/", "tip": "c 读 /s/，结尾 -ed 读 /d/"}, {"w": "regulators", "ipa": "/ˈreɡjuleɪtəz/", "tip": "重音在第一音节，-gu- 读 /ɡju/"}, {"w": "transparent", resentative of the whole population. Busy workers and young people often take part less. As a result, some cities now allow online voting to widen participation. So, participatory budgeting can make public spending fairer and more transparent, but only if it reaches a broad range of citizens.", "words": 200, "topic": {"answer": "participatory budgeting", "how": "定义型：第一句 \"Participatory budgeting is a process in which…\" 被定义的词就是主题。坑：这个术语长、陌生，学生常只记住 \"citizens decide money\" 而说不出 participatory budgeting；另一坑是把第二句的 Porto Alegre / 1989 当重点。主题词在讲座里出现 4 次，结尾再次出现，可确认。"}, "notes": {"candidates": ["participatory budgeting", "Porto Alegre（背景细节）"], "phrases": ["participatory budgeting", "citizens decide public money", "works in stages", "ideas, costed proposals, community votes", "most votes funded: playgrounds, lighting", "increases trust in government", "poorer neighbourhoods larger share ∴ took part", "≠ clear limits", "less than five per cent of budget", "not representative: busy workers, young people", "∴ online voting", "fairer, more transparent, broad range of citizens"]}, "ans58": [["This lecture is mainly talking about", "participatory budgeting, and in this process citizens decide how some public money is spent."], ["Firstly,", "residents suggest ideas, and the whole community votes on proposals."], ["Secondly,", "supporters say it builds trust, and poorer areas received more investment."], ["Thirdly,", "only a small part of the budget, often under five per cent, is decided this way."], ["Furthermore,", "busy workers and young people take part less, so some cities allow online voting."], ["In summary,", "participatory budgeting can make spending fairer, but it must reach many citizens."]], "ans58Words": 89, "ans65": [["This lecture is mainly talking about", "participatory budgeting, {{which}} lets citizens decide how part of a city's money is spent."], ["Firstly,", "residents suggest ideas and volunteers turn them into costed proposals, {{which}} the whole community t ieval effect. When students have to pull information out of memory, rather than simply reread their notes, that memory becomes stronger and lasts longer. Second, frequent quizzes give teachers early feedback. If half the class gets a question wrong in week three, the teacher can reteach the topic before the final exam, not after it. In one secondary school I visited, a science teacher gave a five-minute quiz at the start of every lesson, and the end-of-year results in that class rose noticeably. However, quizzes are not automatically helpful. If students feel that every quiz is being judged, anxiety rises and the benefits disappear. So the design matters. My argument, then, is that schools should use short, frequent quizzes as a learning tool rather than a grading tool, because their real value lies in strengthening memory and guiding teaching.", "words": 187, "notes": {"topic": "low-stakes quizzes → improve learning", "points": ["retrieval effect: recall > reread → memory stronger", "early feedback → teacher reteaches before exam", "BUT judged quizzes → anxiety → benefits lost"], "conclusion": "use quizzes as learning tool, not grading tool"}, "skeleton": "A", "model": "The lecture explains why regular low-stakes quizzes can improve learning. Recalling information from memory strengthens it more than rereading notes, while frequent quizzes also give teachers early feedback, so weak topics can be retaught before exams. The speaker therefore argues that, because judged quizzes raise anxiety, schools should use them as a learning tool rather than a grading tool.", "modelWords": 59, "paraphrase": [{"from": "pull information out of memory, rather than simply reread their notes", "to": "Recalling information from memory strengthens it more than rereading notes", "how": "换句式"}, {"from": "the teacher can reteach the topic before the final exam", "to": "weak topics can be retaught before exams", "how": "换句式"}, {"from": "In one secondary school I visited, a science teacher gave a five-minute quiz…", "to": "（删去）", "how": "取舍"}], "score": {"content": [3, "首句点明主题「低风险小测为何能促进学习」，第二句综合了「提取记忆」和「教师早反馈」两点，第三句给出结论并带上转折（被评判会焦虑）；科学老师的例子已删。核心术语 low-stakes quizzes 保留。未给 4：改写多为句式调整，词汇层面大量沿用原文（learning tool / grading tool）。"], "form": [2, "一段、三句、词数在 50–70 之间。"], "grammar": [2, "while 并列、so 结果从句、because 插入状语都正确，无语法错误。"], "vocab": [2, "strengthens / retaught / raise anxiety 用词准确，B1–B2 水平，无误用。"], "spelling": [2, "无拼写错误。"], "total": 11}, "weak": {"text": "The lecture is about a science teacher who give a five-minute quiz at the start of every lesson and the end-of-year results rose noticeably. When students have to pull information out of memory, rather than simply reread their notes, that memory becomes stronger and lasts longer. Quizzes is not automaticaly helpful because students feel anxiety.", "words": 55, "score": {"content": [1, "首句把例子（科学老师）当成主旨，主线「小测是学习工具而非打分工具」没写；第二句整句照抄原文；教师反馈要点缺失。"], "form": [2, "词数在 50–70 之间，一段完整句子。"], "grammar": [1, "有 2 处主谓一致错误：who give、Quizzes is。"], "vocab": [1, "几乎全是原文原词，没有自己的表达。"], "spelling": [1, "1 处拼写错：automaticaly。"], "total": 6}, "fix": ["首句别写例子：把 The lecture is about a science teacher… 改成 The lecture explains why regular low-stakes quizzes can improve learning.", "语法：who give → who gave（过去发生的事）；Quizzes is → Quizzes are（复数主语配 are）。", "拼写 automaticaly → automatically；第二句整句照抄，改写成 Recalling information strengthens memory more than rereading notes，并补上「早期反馈」和结论句。"]}, "traps": ["把「科学老师每节课五分钟小测」这个例子写进首句当主旨，Content 直接掉档。", "只写「小测有用」，漏掉讲者的主张：要当学习工具而不是打分工具。"], "spell": ["retrieval", "feedback", "anxiety", "automatically", "noticeably"]}, {"id": "SST02", "title": "Smartphones and Attention", "week": "W3", "theme": "科技媒体与AI", "lecture": "Let's consider how smartphones affect our ability to concentrate. Most of us assume that a phone only distracts us when it rings or buzzes, and that is certainly part of the problem. Every notification breaks our focus, and research suggests it can take several minutes to return fully to a complex task. But there is a less obvious effect. In several experiments, students who simply had their phone on the desk, face down and silent, performed worse on memory tests than students who left their phone in another room. The researchers concluded that part of the brain is busy resisting the urge to check the device, which leaves less capacity for the task itself. Now, you might expect me to recommend banning phones from classrooms and offices. However, total bans are difficult to enforce and do not teach people how to manage technology in the rest of their lives. Overall, my view is that the most effective solution is physical distance: keeping phones out of sight during focused work, and helping people build this habit for themselves.", "words": 177, "notes": {"topic": "smartphones → weaken concentration", "points": ["notifications break focus → minutes to return", "silent phone on desk → worse memory (brain resists checking)", "BUT total bans hard to enforce, don't teach self-management"], "conclusion": "keep phones out of sight during focused work; build the habit"}, "skeleton": "C", "model": "The lecture discusses how smartphones affect people's concentration and how this problem should be managed. First, every notification breaks focus, and returning to a complex task can take several minutes. In addition, even a silent phone nearby weakens memory; however, total bans are hard to enforce. Overall, the speaker argues that keeping phones out of sight during focused work is the most effective solution.", "modelWords": 64, "paraphrase": [{"from": "students who simply had their phone on the desk, face down and silent, performed worse on memory tests", "to": "even a silent phone nearby weakens memory", "how": "换句式"}, {"from": "total bans are difficult to enforce", "to": "total bans are hard to enforce", "how": "换词"}, {"from": "my view is that the most effective solution is physical distance", "to": "the speaker argues that keeping phones out of sight … is the most effective solution", "how": "换句式"}], "score": {"content": [3, "四句对应主题 / 通知打断 / 静音手机也伤记忆+禁令难执行 / 结论，主线齐全，实验细节被压缩。未给 4：「大脑在抵抗查看冲动」这一原因被舍去，且第二句较贴近原文。"], "form": [2, "一段四句，词数在 50–70 之间。"], "grammar": [2, "分号 + however 用法正确，动名词作主语 keeping phones… is 主谓一致。"], "vocab": [2, "weakens / enforce / managed 用词恰当。"], "spelling": [2, "无拼写错误。"], "total": 11}, "weak": {"text": "The speaker talk about phones. Every notification breaks our focus, and research suggests it can take several minutes to return fully to a complex task. Students who simply had their phone on the desk performed worse on memory tests. So the speaker think we should banning phones from classrooms and offices because they are a big distraktion.", "words": 57, "score": {"content": [1, "结论写反了：讲者明确说禁令难执行，主张是「把手机放远」；中间两句基本照抄原文。"], "form": [2, "词数在 50–70 之间。"], "grammar": [1, "2 处错误：speaker talk / speaker think 主谓一致（算 1 类）；should banning 情态动词后用了 -ing。"], "vocab": [1, "主题句 talk about phones 过于笼统，其余照抄。"], "spelling": [1, "1 处拼写错：distraktion。"], "total": 6}, "fix": ["结论别凭常识猜：讲者用 However 否定了禁令，最后一句改为 Overall, the speaker argues that keeping phones out of sight works best.", "语法：The speaker talk → talks，the speaker think → thinks；should banning → should ban。", "拼写 distraktion → distraction；第二、三句照抄，压缩成 notifications interrupt focus 和 even a silent phone weakens memory。"]}, "traps": ["听到 banning phones 就以为是讲者主张，没注意后面的 However 转折，结论写反。", "把实验细节（face down and silent、another room）原样抄进来，挤掉结论的字数。"], "spell": ["notification", "concentration", "distraction", "enforce", "technology"]}, {"id": "SST03", "title": "Trees and the Urban Heat Island", "week": "W4", "theme": "环境气候能源", "lecture": "Cities are getting hotter, and not only because of global warming. Concrete, asphalt and dark roofs absorb heat during the day and release it at night, creating what is known as the urban heat island effect. In some large cities, central districts can be up to seven degrees warmer than the surrounding countryside. One of the most cost-effective responses is planting trees. Trees cool streets in two ways. First, their shade stops sunlight from reaching surfaces such as roads and walls. Second, they release water vapour through their leaves, which cools the air around them, rather like a natural air conditioner. Studies in several European cities found that streets with a full canopy were noticeably cooler on summer afternoons, which reduced the demand for electric air conditioning. However, trees are not a quick fix. A young tree may need ten or fifteen years before it provides meaningful shade, and many trees die early because they are planted without enough soil or water. For this reason, I would argue that cities must treat trees as long-term infrastructure, planning and maintaining them as carefully as roads and drains.", "words": 186, "notes": {"topic": "trees → reduce urban heat island", "points": ["shade blocks sun from roads/walls", "water vapour cools air → less air-con demand", "BUT young trees slow (10–15 yrs), many die early"], "conclusion": "treat trees as long-term infrastructure"}, "skeleton": "A", "model": "The lecture explains how planting trees can reduce the urban heat island effect, which makes city centres hotter than the countryside. Trees cool streets because their shade blocks sunlight, while the water vapour they release lowers air temperature and reduces air-conditioning demand. Since young trees take years to provide shade and often die early, the speaker concludes that cities must treat trees as long-term infrastructure.", "modelWords": 65, "paraphrase": [{"from": "their shade stops sunlight from reaching surfaces such as roads and walls", "to": "their shade blocks sunlight", "how": "换词"}, {"from": "which cools the air around them", "to": "lowers air temperature", "how": "换词"}, {"from": "Studies in several European cities found that streets with a full canopy…", "to": "（删去研究细节，只保留 reduces air-conditioning demand）", "how": "取舍"}], "score": {"content": [3, "首句点题（树木缓解热岛效应），第二句用 because…while 合并两种降温机制，第三句把转折（树长得慢、易死）作为原因引出结论。保留核心术语 urban heat island effect。未给 4：结论里的「像道路排水一样规划维护」细节被省略，改写幅度中等。"], "form": [2, "一段三句，词数在 50–70 之间。"], "grammar": [2, "which 定语从句、because…while 复合句、Since 原因状语从句均正确。"], "vocab": [2, "blocks / lowers / infrastructure 用词准确，英式拼写 centres 一致。"], "spelling": [2, "无拼写错误。"], "total": 11}, "weak": {"text": "The lecture is about European cities. Concrete, asphalt and dark roofs absorb heat during the day and release it at night, creating what is known as the urban heat island effect. Trees releases water vapour and it make the streets cooler like a natural air conditoner. Trees are not a quick fix because young trees need ten years.", "words": 58, "score": {"content": [2, "抓到热岛效应和水汽降温，但首句主旨抓偏（写成欧洲城市），第二句整句照抄，且缺少讲者结论「把树当长期基础设施」。"], "form": [2, "词数在 50–70 之间。"], "grammar": [1, "2 处主谓一致错误：Trees releases、it make。"], "vocab": [1, "大段原词照搬，表达单一。"], "spelling": [1, "1 处拼写错：conditoner。"], "total": 7}, "fix": ["首句改为 The lecture explains how planting trees can reduce the urban heat island effect，European cities 只是研究地点，不是主题。", "语法：Trees releases → Trees release；it make → it makes；拼写 conditoner → conditioner。", "第二句照抄原文定义，压缩成 which makes city centres hotter；结尾补 the speaker concludes that cities must treat trees as long-term infrastructure。"]}, "traps": ["只写「树木降温」而漏掉讲者真正的主张：树要当长期基础设施来规划维护。", "把 seven degrees、ten or fifteen years 等数字细节写满，挤掉结论。"], "spell": ["infrastructure", "vapour", "asphalt", "conditioner", "temperature"]}, {"id": "SST04", "title": "Congestion Charging", "week": "W5", "theme": "城市交通建筑", "lecture": "Traffic congestion costs cities enormous amounts of time and money, and for decades the standard response was to build more roads. Unfortunately, new roads tend to fill up again within a few years, a pattern transport planners call induced demand. An alternative approach is congestion charging, where drivers pay a fee to enter the city centre at busy times. The logic is simple: if driving at peak hours has a price, some people will travel earlier, share a car or switch to public transport. Cities that have introduced such schemes, including London and Stockholm, recorded significant falls in traffic, and in Stockholm air quality in the centre also improved. Importantly, the money collected can be reinvested in buses and cycle lanes, which makes the alternatives more attractive. Of course, these schemes are rarely popular at first. Critics argue that they are unfair to lower-income drivers, who may have no realistic option but to drive. Yet in Stockholm, public support actually increased once residents experienced the benefits. So my conclusion is that congestion charging, when combined with better public transport, is one of the most effective tools cities have for managing traffic.", "words": 191, "notes": {"topic": "congestion charging vs building roads", "points": ["new roads fill up (induced demand)", "peak-time fee → less traffic, cleaner air", "revenue → buses & cycle lanes; BUT unpopular/unfair at first"], "conclusion": "with better public transport = most effective tool"}, "skeleton": "B", "model": "The speaker discusses congestion charging as an alternative to building new roads, explaining that a peak-time fee reduces traffic and improves air quality and that the revenue can fund buses and cycle lanes. Although such schemes are initially unpopular and may seem unfair to lower-income drivers, the lecture concludes that, combined with better public transport, they are highly effective for managing traffic.", "modelWords": 62, "paraphrase": [{"from": "drivers pay a fee to enter the city centre at busy times", "to": "a peak-time fee", "how": "换词性"}, {"from": "the money collected can be reinvested in buses and cycle lanes", "to": "the revenue can fund buses and cycle lanes", "how": "换词"}, {"from": "these schemes are rarely popular at first", "to": "such schemes are initially unpopular", "how": "换词"}], "score": {"content": [3, "两句覆盖主题、两大好处、反对意见和结论；London/Stockholm 例子删去。未给 4：induced demand（新路很快又堵）这一对比原因没有写出，结论仍较贴近原句。"], "form": [2, "一段两句，词数在 50–70 之间。"], "grammar": [2, "explaining that…and that… 并列宾语从句、Although 让步从句结构正确。"], "vocab": [2, "peak-time fee / revenue / initially 准确且有改写。"], "spelling": [2, "无拼写错误。"], "total": 11}, "weak": {"text": "The speaker talks about Stockholm. Cities that have introduced such schemes, including London and Stockholm, recorded significant falls in traffic, and in Stockholm air quality in the centre also improved. Critics argue that they are unfair to lower-income drivers. So the speaker say that congestion charging are one of the most efective tools cities have.", "words": 55, "score": {"content": [1, "首句把例子城市当主旨；第二句整句照抄；漏掉「收费收入投入公交」和「需配合公共交通」这一结论条件。"], "form": [2, "词数在 50–70 之间。"], "grammar": [1, "2 处主谓一致错误：the speaker say、congestion charging are。"], "vocab": [1, "大段照抄原文，无改写。"], "spelling": [1, "1 处拼写错：efective。"], "total": 6}, "fix": ["首句别写 Stockholm：套骨架 B 写 The speaker discusses congestion charging as an alternative to building new roads, explaining that…", "语法：the speaker say → says；congestion charging are → is（不可数/单数概念）；拼写 efective → effective。", "第二句照抄例子，删掉城市名，改成 a peak-time fee reduces traffic；结论补上条件 combined with better public transport。"]}, "traps": ["把 London 和 Stockholm 的案例写成主旨或大段照抄，Content 掉到 1–2。", "结论漏掉条件「配合更好的公共交通」，讲者主张不完整。"], "spell": ["congestion", "revenue", "effective", "initially", "alternative"]}, {"id": "SST05", "title": "The Hidden Risk of Sitting", "week": "W6", "theme": "健康医学运动", "lecture": "Most public health advice focuses on exercise, encouraging people to do around thirty minutes of moderate activity a day. That advice is sound, but recent research suggests it misses an important point. The total time we spend sitting appears to be a separate risk factor. Large studies following thousands of adults have found that people who sit for more than eight hours a day have a higher risk of heart disease and type 2 diabetes, even if they exercise regularly. The reason seems to be that long periods of inactivity slow down the way the body processes sugar and fat. A morning run cannot fully cancel out a day spent at a desk. The encouraging news is that small changes help. Standing up and moving for just two or three minutes every half hour has been shown to improve blood sugar levels. Some offices have introduced standing desks, though the evidence on these is still mixed. My conclusion, therefore, is that health guidelines should tell people not only to exercise more but also to sit less, and to break up long periods of sitting throughout the day.", "words": 187, "notes": {"topic": "sitting time = separate health risk", "points": [">8 hrs sitting → heart disease, diabetes, even if exercise", "inactivity slows sugar & fat processing", "BUT small breaks (2–3 min / 30 min) help"], "conclusion": "guidelines: exercise more AND sit less, break up sitting"}, "skeleton": "A", "model": "The lecture explains why total sitting time is a health risk separate from a lack of exercise. Sitting for over eight hours daily raises the risk of heart disease and diabetes even among regular exercisers, because inactivity slows how the body processes sugar and fat. The speaker therefore argues that guidelines should urge people to sit less and break up sitting with movement breaks.", "modelWords": 64, "paraphrase": [{"from": "people who sit for more than eight hours a day have a higher risk of heart disease", "to": "Sitting for over eight hours daily raises the risk of heart disease", "how": "换句式"}, {"from": "even if they exercise regularly", "to": "even among regular exercisers", "how": "换词性"}, {"from": "Some offices have introduced standing desks, though the evidence on these is still mixed", "to": "（删去）", "how": "取舍"}], "score": {"content": [3, "首句点明「久坐是独立于缺乏运动的风险」，第二句用 because 把风险和原因合并，第三句给结论并吸收了「短暂活动有帮助」。未给 4：「运动建议本身没错」这层转折只隐含在 separate from 中，没有明确写出。"], "form": [2, "一段三句，词数在 50–70 之间。"], "grammar": [2, "动名词主语 Sitting…raises、how 引导宾语从句均正确。"], "vocab": [2, "regular exercisers / urge / movement breaks 用词自然。"], "spelling": [2, "无拼写错误。"], "total": 11}, "weak": {"text": "The lecture is about standing desks in offices. Large studies following thousands of adults have found that people who sit for more than eight hours a day have a higher risk of heart disease and type 2 diabetes. A morning run cannot cancel a day at a desk, so people should exercising more and sits less in the dayly life.", "words": 60, "score": {"content": [1, "首句把讲者一句带过、且证据不足的 standing desks 当主旨；第二句整句照抄；原因（代谢变慢）缺失。"], "form": [2, "词数在 50–70 之间。"], "grammar": [1, "2 处错误：should exercising、sits less（情态动词后应接动词原形）；in the dayly life 冠词多余。"], "vocab": [1, "大量原词照搬。"], "spelling": [1, "1 处拼写错：dayly。"], "total": 6}, "fix": ["首句改成 The lecture explains why the total time people spend sitting is a separate health risk，standing desks 只是附带一提的例子。", "语法：should exercising more and sits less → should exercise more and sit less；去掉 in the dayly life 的 the，拼写 dayly → daily。", "第二句照抄研究原句，改写为 Sitting for over eight hours a day raises the risk of heart disease，并补原因 because inactivity slows how the body processes sugar and fat。"]}, "traps": ["只写「多运动」，漏掉讲者核心观点：久坐本身是独立风险，要「少坐」。", "把 standing desks 当成解决方案写进结论，而讲者说这方面证据还不一致。"], "spell": ["diabetes", "inactivity", "guidelines", "processes", "separate"]}, {"id": "SST06", "title": "The Four-Day Week", "week": "W7", "theme": "工作职场与生活平衡", "lecture": "In the past few years, a number of companies around the world have experimented with a four-day working week, in which employees work around thirty-two hours for the same salary. The results so far have been surprisingly positive. In large trials involving dozens of organisations, most companies reported that productivity stayed the same or even improved. The main explanation is that a shorter week forces teams to cut unnecessary meetings and focus on the work that really matters. Employees also benefit directly. Surveys from these trials show lower levels of stress and burnout, and staff were less likely to take sick days or leave their jobs. For employers, keeping experienced staff saves considerable recruitment and training costs. However, the model does not suit every sector equally. Hospitals, schools and shops need people present for fixed hours, so reducing the week there often means hiring extra staff, which raises costs. One care home in the trial actually returned to a five-day week for this reason. My argument is that the four-day week deserves serious consideration in office-based work, but it should be adapted carefully rather than imposed everywhere.", "words": 187, "notes": {"topic": "four-day week (same pay) → effects", "points": ["productivity same/better: fewer meetings", "staff less stress, fewer sick days, stay → save hiring costs", "BUT fixed-hour sectors need extra staff → higher costs"], "conclusion": "consider for office work, adapt carefully, not everywhere"}, "skeleton": "A", "model": "The lecture explains how a four-day working week with the same salary affects companies and employees. Most trial firms kept or improved productivity because shorter weeks reduced unnecessary meetings, while staff reported less stress, fewer sick days and lower turnover. The speaker therefore concludes that the model suits office work but should be adapted carefully, because services needing fixed hours face higher costs.", "modelWords": 63, "paraphrase": [{"from": "staff were less likely to … leave their jobs", "to": "lower turnover", "how": "换词性"}, {"from": "Hospitals, schools and shops need people present for fixed hours", "to": "services needing fixed hours", "how": "取舍"}, {"from": "productivity stayed the same or even improved", "to": "kept or improved productivity", "how": "换句式"}], "score": {"content": [3, "三句覆盖主题、生产率与员工福利两大要点、行业局限的转折和讲者主张；care home 例子删掉。未给 4：「留住员工节省招聘培训成本」只用 turnover 一笔带过，对雇主的好处未展开。"], "form": [2, "一段三句，词数在 50–70 之间。"], "grammar": [2, "because…while 层次清楚，现在分词短语 needing fixed hours 作定语正确。"], "vocab": [2, "turnover / productivity / adapted 用词准确。"], "spelling": [2, "无拼写错误。"], "total": 11}, "weak": {"text": "The lecture is about a care home that returned to a five-day week. In large trials involving dozens of organisations, most companies reported that productivity stayed the same or even improved. Workers has less stress and burnout and they takes less sick days. The speaker think four-day week should be use in hospitals and shops becuse it is good.", "words": 59, "score": {"content": [1, "首句把例子当主旨；结论与讲者主张相反（讲者说医院、商店等固定工时行业不适合）；第二句照抄。"], "form": [2, "词数在 50–70 之间。"], "grammar": [1, "多处错误：Workers has、they takes（主谓一致）；should be use 被动语态错误。"], "vocab": [1, "good、less sick days 等表达不准确，其余照抄。"], "spelling": [1, "1 处拼写错：becuse。"], "total": 6}, "fix": ["首句改成 The lecture explains how a four-day working week with the same salary affects companies and employees，care home 只是转折处的例子。", "语法：Workers has → have，they takes → take，should be use → should be used；less sick days → fewer sick days；拼写 becuse → because。", "结论写反了：讲者说 However, the model does not suit every sector，应写 the model suits office work but should be adapted carefully。"]}, "traps": ["没听清 However 之后的行业限制，结论写成「所有行业都该推行」。", "把 thirty-two hours、dozens of organisations 等数字照抄，浪费字数。"], "spell": ["productivity", "unnecessary", "recruitment", "organisations", "turnover"]}, {"id": "SST07", "title": "What Loyalty Programmes Really Do", "week": "W8", "theme": "商业消费广告", "lecture": "Almost every supermarket, airline and coffee chain now offers a loyalty programme, and it is worth asking why businesses invest so heavily in them. The obvious answer is that rewards encourage customers to return. If you are two stamps away from a free coffee, you are more likely to choose the same café again. But the more valuable benefit for companies is data. Every time a customer scans a loyalty card, the business learns what was bought, when and where. This information allows retailers to send personalised offers, plan stock and set prices more precisely. Some analysts argue that this data is worth more to the company than the discounts it gives away. However, loyalty programmes are less effective than they once were. Because nearly every competitor now has one, customers often join several schemes and simply choose whichever offers the best deal that day. In other words, the programmes no longer create genuine loyalty. Overall, I would suggest that loyalty schemes today are best understood as data-collection tools rather than as a way of keeping customers faithful to a single brand.", "words": 182, "notes": {"topic": "why businesses invest in loyalty programmes", "points": ["rewards → customers return", "card data → personalised offers, stock, prices (more valuable)", "BUT everyone has one → customers join many → no real loyalty"], "conclusion": "schemes = data-collection tools, not loyalty builders"}, "skeleton": "C", "model": "The lecture discusses why businesses invest heavily in loyalty programmes and what these schemes really achieve. First, rewards encourage customers to return, so they keep choosing the same business. In addition, card data helps retailers personalise offers and prices; however, customers now join competing schemes. Overall, the speaker argues that these programmes mainly collect data rather than create genuine customer loyalty.", "modelWords": 61, "paraphrase": [{"from": "This information allows retailers to send personalised offers … and set prices more precisely", "to": "card data helps retailers personalise offers and prices", "how": "换词性"}, {"from": "If you are two stamps away from a free coffee…", "to": "（删去）", "how": "取舍"}, {"from": "customers often join several schemes", "to": "customers now join competing schemes", "how": "换词"}], "score": {"content": [3, "四句依次为主题 / 奖励促回头 / 数据价值+转折 / 结论，主线完整，免费咖啡例子已删。未给 4：「数据比折扣更值钱」这个比较和「只选当天最划算」的原因被压缩掉，综合程度一般。"], "form": [2, "一段四句，每句不超过 16 词，总词数在 50–70 之间。"], "grammar": [2, "分号 + however、rather than 并列结构正确。"], "vocab": [2, "personalise / competing / genuine 准确，英式拼写一致。"], "spelling": [2, "无拼写错误。"], "total": 11}, "weak": {"text": "The lecture is about free coffee. If you are two stamps away from a free coffee, you are more likely to choose the same café again. Every time a customer scans a loyalty card, the business learns what was bought, when and where. Customers joins many schemes so loyalty programmes is not effective and they are bad for bussiness.", "words": 59, "score": {"content": [1, "首句主旨抓成例子「免费咖啡」；前两句照抄；结论「对企业不好」与讲者「本质是数据工具」的主张不符。"], "form": [2, "词数在 50–70 之间。"], "grammar": [1, "2 处主谓一致错误：Customers joins、programmes is。"], "vocab": [1, "bad for business 过于口语且偏离原意，其余照抄。"], "spelling": [1, "1 处拼写错：bussiness。"], "total": 6}, "fix": ["首句改成 The lecture discusses why businesses invest heavily in loyalty programmes，free coffee 是例子不是主题。", "语法：Customers joins → join；programmes is → are；拼写 bussiness → business。", "结论别自己下判断：讲者说它们是 data-collection tools，应写 the speaker argues that these programmes mainly collect data rather than create genuine loyalty。"]}, "traps": ["只写「奖励让顾客回头」这个表层原因，漏掉讲者强调的「数据才是更大的价值」。", "四句式每句超过 16 词，句子拖长导致语法出错。"], "spell": ["loyalty", "personalised", "competitor", "genuine", "business"]}, {"id": "SST08", "title": "Why Libraries Still Matter", "week": "W9", "theme": "政府法律公共资金", "lecture": "When governments face budget pressure, public libraries are often among the first services to lose funding. The reasoning is understandable: if people can find almost anything online, why pay for buildings full of books? However, this view misunderstands what modern libraries actually do. First, libraries provide free internet access and computer help to people who cannot afford them at home. In many towns, the library is where job seekers apply for work, older people learn to use online banking, and residents complete government forms that are now only available digitally. Second, libraries are one of the few indoor public spaces where anyone can stay without having to spend money. For students without a quiet place to study, or for isolated older residents, this matters a great deal. Closing a library might save a council a modest amount in the short term, but the costs appear later, in lower digital skills and greater social isolation. For these reasons, I believe libraries should be funded as essential community infrastructure, not treated as an optional extra.", "words": 173, "notes": {"topic": "public libraries → should keep funding", "points": ["free internet + computer help (jobs, banking, forms)", "free indoor space: study, isolated elderly", "closing saves a little short-term; BUT later costs: digital skills, isolation"], "conclusion": "fund as essential community infrastructure"}, "skeleton": "B", "model": "The speaker discusses why public libraries should keep their funding, explaining that they offer free internet access and digital help to those without it and that they provide free indoor spaces for study and social contact. Although closing libraries may save money in the short term, the lecture concludes that they should be funded as essential community infrastructure.", "modelWords": 58, "paraphrase": [{"from": "people who cannot afford them at home", "to": "those without it", "how": "换句式"}, {"from": "anyone can stay without having to spend money", "to": "free indoor spaces", "how": "换词性"}, {"from": "job seekers apply for work, older people learn to use online banking…", "to": "（归纳为 digital help）", "how": "取舍"}], "score": {"content": [3, "两句抓住主题、两个功能和「短期省钱」的让步，结论原样保留核心表述。未给 4：「关闭的长期代价（数字技能下降、社会孤立）」没有写出，信息有遗漏。"], "form": [2, "一段两句，词数在 50–70 之间。"], "grammar": [2, "explaining that…and that… 并列结构完整，Although 从句正确。"], "vocab": [2, "digital help / social contact 是恰当的概括词。"], "spelling": [2, "无拼写错误。"], "total": 11}, "weak": {"text": "The lecture is about online banking for older people. In many towns, the library is where job seekers apply for work, older people learn to use online banking, and residents complete government forms. Library are free place for students to study. The speaker believe libraries should be funded and it is not a optional extra for the goverment.", "words": 58, "score": {"content": [2, "写到了两个功能和结论，但首句把例子（老人学网银）当主旨，第二句大段照抄，没有「短期省钱」这层转折。"], "form": [2, "词数在 50–70 之间。"], "grammar": [1, "错误：Library are free place（主谓一致 + 缺冠词）；The speaker believe（主谓一致）；a optional → an optional。"], "vocab": [1, "表达单一，多处照抄。"], "spelling": [1, "1 处拼写错：goverment。"], "total": 7}, "fix": ["首句套骨架 B：The speaker discusses why public libraries should keep their funding, explaining that…，网银只是例子。", "语法：Library are free place → Libraries are free places；The speaker believe → believes；a optional → an optional；拼写 goverment → government。", "第二句照抄三个例子，归纳成 free internet access and digital help；第二句开头补上 Although closing libraries may save money in the short term。"]}, "traps": ["把 job seekers、online banking、government forms 一串例子照抄进来，没有归纳成「免费上网与数字帮助」。", "漏掉讲者开头的 However：讲者反驳「网上都有，何必要图书馆」，不是支持削减经费。"], "spell": ["infrastructure", "isolation", "government", "digitally", "essential"]}, {"id": "SST09", "title": "Reading Aloud to Children", "week": "W10", "theme": "家庭成长青年", "lecture": "Parents are often told to read to their young children, but it is worth looking at why this activity is so powerful. The first benefit is vocabulary. Picture books contain a surprisingly wide range of words, many of which children would rarely hear in everyday conversation. One study estimated that children who are read to every day hear over a million more words before starting school than children who are rarely read to. The second benefit is less about language and more about relationships. Shared reading creates a calm, regular time when a parent and child focus on each other, and this can strengthen emotional bonds and help children learn to manage their feelings. Interestingly, the benefits are greatest when the adult talks with the child about the story, asking questions and pointing at pictures, rather than just reading the words. Of course, many working parents feel they simply do not have time. But research suggests that even ten minutes a day makes a measurable difference. So my message is that regular, interactive reading is one of the simplest and most effective ways families can support a child's development.", "words": 189, "notes": {"topic": "reading aloud to young children → why powerful", "points": ["vocabulary: picture books > everyday talk", "relationships: bonds + managing feelings", "best when interactive; BUT parents busy → 10 min enough"], "conclusion": "regular interactive reading = simple, effective support"}, "skeleton": "A", "model": "The lecture explains why reading aloud to young children is a powerful way to support their development. Picture books expose children to a much wider vocabulary than everyday conversation, while shared reading strengthens emotional bonds, especially when adults discuss the story. The speaker therefore concludes that, although many parents feel busy, even ten minutes of regular, interactive reading each day makes a measurable difference.", "modelWords": 64, "paraphrase": [{"from": "Picture books contain a surprisingly wide range of words", "to": "Picture books expose children to a much wider vocabulary", "how": "换句式"}, {"from": "the adult talks with the child about the story, asking questions and pointing at pictures", "to": "when adults discuss the story", "how": "取舍"}, {"from": "many working parents feel they simply do not have time", "to": "many parents feel busy", "how": "换词"}], "score": {"content": [3, "首句写主旨，第二句用 while 合并词汇与亲子关系两点，并吸收「互动讲故事效果最好」，第三句把转折和结论合并；「一百万个词」的研究数据已删。未给 4：「帮助孩子管理情绪」未提及，结论贴近原文 measurable difference。"], "form": [2, "一段三句，词数在 50–70 之间。"], "grammar": [2, "比较结构 wider…than、although 插入从句使用正确。"], "vocab": [2, "expose / emotional bonds / interactive 准确。"], "spelling": [2, "无拼写错误。"], "total": 11}, "weak": {"text": "The lecture is about a study of one million words. One study estimated that children who are read to every day hear over a million more words before starting school than children who are rarely read to. Parents should reads books to child every day because it help vocabulery and they will be close.", "words": 54, "score": {"content": [1, "首句把研究数据当主旨，第二句整句照抄，亲子关系和「互动、十分钟就有效」的结论都没写清楚。"], "form": [2, "词数在 50–70 之间。"], "grammar": [1, "2 处错误：should reads（情态动词后用原形）；it help（主谓一致）；to child 缺冠词。"], "vocab": [1, "they will be close 表达模糊，其余照抄。"], "spelling": [1, "1 处拼写错：vocabulery。"], "total": 6}, "fix": ["首句改为 The lecture explains why reading aloud to young children is a powerful way to support their development，「一百万个词」只是证据。", "语法：should reads → should read；it help → it helps；to child → to their children；拼写 vocabulery → vocabulary。", "把照抄的研究句删掉，换成 Picture books expose children to a much wider vocabulary，并补结论 even ten minutes of interactive reading makes a measurable difference。"]}, "traps": ["被 a million more words 这个醒目数字吸引，写成主旨。", "漏掉「互动式阅读效果最好」和「每天十分钟就有用」，结论变成空泛的「要多读书」。"], "spell": ["vocabulary", "emotional", "interactive", "measurable", "development"]}, {"id": "SST10", "title": "Why Languages Disappear", "week": "W11", "theme": "全球化语言迁移与文化艺术", "lecture": "Of the roughly seven thousand languages spoken in the world today, linguists estimate that around half could disappear by the end of this century. Languages rarely die suddenly. Instead, the process usually happens over three generations. Parents who speak a minority language decide to raise their children in a dominant language, such as English or Spanish, because they believe it will offer better jobs and education. Those children may understand the old language but rarely speak it, and their own children never learn it at all. When a language disappears, we lose more than words. Many languages contain detailed knowledge about local plants, animals and the environment, as well as stories and ways of thinking that cannot be fully translated. The good news is that decline can be reversed. In New Zealand, for example, Māori language preschools, where young children are taught entirely in te reo Māori, helped to increase the number of young speakers after decades of decline. However, revival requires long-term commitment from both communities and governments. I would therefore argue that protecting endangered languages should be seen as protecting knowledge, not simply as preserving tradition.", "words": 188, "notes": {"topic": "how languages disappear & why it matters", "points": ["3 generations: parents choose dominant language for jobs/education", "loss = environmental knowledge, stories, untranslatable ideas", "revival possible BUT needs long-term commitment"], "conclusion": "protecting languages = protecting knowledge, not just tradition"}, "skeleton": "A", "model": "The lecture explains how languages disappear and why the loss of a language matters. Languages usually decline over three generations as parents choose dominant languages for better opportunities, and each lost language takes with it local environmental knowledge and ideas that cannot be translated. The speaker therefore argues that, although revival needs long-term commitment, protecting endangered languages means protecting knowledge, not just tradition.", "modelWords": 63, "paraphrase": [{"from": "decide to raise their children in a dominant language … because they believe it will offer better jobs and education", "to": "parents choose dominant languages for better opportunities", "how": "换句式"}, {"from": "revival requires long-term commitment from both communities and governments", "to": "revival needs long-term commitment", "how": "换词"}, {"from": "In New Zealand, for example, Māori language preschools…", "to": "（删去）", "how": "取舍"}], "score": {"content": [3, "首句写「语言如何消失、为何重要」，第二句用 and 并列「三代衰退过程」和「失去的是知识」，第三句含转折并给出讲者主张；毛利语例子删掉。未给 4：「衰退可以逆转」只隐含在 revival 中，改写深度一般。"], "form": [2, "一段三句，词数在 50–70 之间。"], "grammar": [2, "as 原因从句、and 并列、takes with it（宾语后置）结构均正确。"], "vocab": [2, "dominant / opportunities / endangered 准确。"], "spelling": [2, "无拼写错误。"], "total": 11}, "weak": {"text": "The lecture is about Maori preschools in New Zealand. Parents who speak a minority language decide to raise their children in a dominant language, such as English or Spanish, because they believe it will offer better jobs and education. Many language contain knowledge and the speaker want to protect tradision.", "words": 50, "score": {"content": [1, "首句把新西兰毛利语幼儿园这个例子当主旨；第二句整句照抄；结论写成「保护传统」，正好与讲者「不只是传统，而是知识」相反。"], "form": [2, "词数在 50–70 之间。"], "grammar": [1, "2 处错误：Many language contain（名词应为复数 languages）；the speaker want（主谓一致）。"], "vocab": [1, "照抄为主，缺少概括词。"], "spelling": [1, "1 处拼写错：tradision。"], "total": 6}, "fix": ["首句改为 The lecture explains how languages disappear and why the loss of a language matters，毛利语幼儿园只是「可以逆转」的例子。", "语法：Many language contain → Many languages contain；the speaker want → wants；拼写 tradision → tradition。", "结论抓错重点：讲者说 protecting knowledge, not simply preserving tradition，照抄的第二句压缩为 parents choose dominant languages for better opportunities。"]}, "traps": ["被 New Zealand 的本地例子吸引，首句写成毛利语幼儿园。", "结论漏掉 not simply 的对比，把讲者主张写成「保护传统」。"], "spell": ["generations", "endangered", "environmental", "commitment", "tradition"]}], "we": [{"id": "WE01", "type": "A", "typeName": "同意与否", "week": "W1", "theme": "教育评价与学校制度", "prompt": "Many schools still rely on final examinations to decide students' grades. Some educators suggest that continuous assessment, such as projects and regular assignments, should replace final exams completely. To what extent do you agree or disagree? Support your opinion with reasons and examples from your own experience or observation.", "stance": "大体同意：多数科目应以平时测评取代期末考试，因为它更公平，也能促进持续学习。", "plan": {"pro": ["fairer picture of learning, less exam-day pressure", "encourages regular study and timely feedback"], "con": ["final exams are easy to organise and compare", "exams make cheating more difficult"], "chain": "平时测评 → 一次失手不再决定全年成绩，学生每周都要学习 → 成绩更公平、学习效果更好"}, "paras": [{"role": "开头段", "text": "Nowadays, whether continuous assessment should replace final exams is a controversial issue in society. Some people argue that final exams are the fairest way to test what students know, while others believe that regular assignments and projects show students' real ability better. Personally, I believe that continuous assessment should replace final exams in most subjects, so I largely agree."}, {"role": "Body1", "text": "To begin with, continuous assessment reduces stress and gives a more accurate picture of learning. For example, a student who feels sick on the day of a final exam may lose marks for a whole year of hard work. In addition, when marks come from several assignments, one bad day does not decide the final grade. Also, many students who panic in exam halls perform much better when they can complete a project with enough time. This shows that continuous assessment measures what students really know rather than how well they handle pressure."}, {"role": "Body2", "text": "Besides, I also believe that continuous assessment encourages students to study regularly. For example, when there is a small task every two weeks, students cannot leave all their revision until the last month. In addition, teachers can give feedback on each assignment, so students can correct their mistakes before the end of the course. Also, projects often require research and teamwork, which are useful skills for university and work. This shows that continuous assessment not only tests learning but also improves it."}, {"role": "结尾段", "text": "In conclusion, although final exams are easy to organise and help to prevent cheating, I believe that continuous assessment should replace them in most subjects because it gives a fairer result and helps students learn steadily throughout the year."}], "words": 273, "score": {"content": [5, "开头末句 'in most subjects, so I largely agree' 明确回答了同意的程度；两段论点（更公平、促进持续学习）都紧扣题目。"], "dsc": [5, "四段分工清楚，Body1 三个例子都在说明'一次失手'问题，总结句 'measures what students really know rather than how well they handle pressure' 回扣论点。"], "glr": [4,  too easy", "students may stop thinking for themselves"], "chain": "全面禁止 AI → 学生偷偷用、诚实学生被误判，毕业后又不会用 → 不如教会学生负责任地使用"}, "paras": [{"role": "开头段", "text": "Nowadays, whether universities should ban AI tools for student assignments is a controversial issue in society. Some people argue that these tools make cheating too easy, while others believe that students need to learn how to use them properly. Personally, I believe that a complete ban is a mistake, so I mostly disagree with this idea."}, {"role": "Body1", "text": "To begin with, AI tools will be a normal part of most jobs in the future. For example, many office workers already use AI to draft emails and reports more quickly. In addition, engineers and programmers often use these tools to check their code and find errors. Also, employers increasingly expect new graduates to know how to give clear instructions to AI and check its answers. This shows that universities should prepare students for the real workplace instead of pretending that this technology does not exist."}, {"role": "Body2", "text": "Besides, I also believe that a ban would be very difficult to enforce. For example, students can easily use AI on their phones at home, where no lecturer can see them. In addition, detection software sometimes makes mistakes and may accuse honest students of cheating. Also, a strict ban might push students to hide their use of AI rather than discuss it openly with their lecturers. This shows that clear rules on how to use AI responsibly would work better than a complete ban."}, {"role": "结尾段", "text": "In conclusion, although AI tools can be misused for cheating, I believe that universities should not ban them completely because students need these skills for future jobs and a ban would be almost impossible to enforce."}], "words": 262, "score": {"content": [5, "'I mostly disagree' 明确了程度，两个理由（未来工作需要、禁令难执行）都直接针对'全面禁止'。"], "dsc": [4, "Body1 的前两个例子写的是上班族和工程师，与'大学作业'的联系要靠读者自己推，衔接略弱。"], "glr": [4, "大量使用 'can / may / might' 加 更多人、通勤变短、房价更低 → 城市运转更高效、居民生活成本下降"}, "paras": [{"role": "开头段", "text": "Nowadays, building high-rise apartments instead of family houses is a controversial issue in society. Some people argue that tall buildings make better use of limited land, while others believe that they create crowded and stressful living conditions. Personally, I believe that the advantages of high-rise apartments outweigh the disadvantages."}, {"role": "Body1", "text": "To begin with, high-rise apartments allow more people to live close to the city centre. For example, one apartment tower can provide homes for hundreds of families on the same land as twenty houses. In addition, people who live near their workplace can walk or take a short bus ride instead of driving for an hour. Also, having more residents in one area means that shops, cafés and clinics have enough customers to stay open. This shows that tall buildings help cities use land in a more efficient way."}, {"role": "Body2", "text": "Besides, I also believe that apartments can be more affordable and convenient than houses. For example, a small apartment usually costs less to buy or rent than a house in the same suburb. In addition, apartment owners do not need to spend weekends mowing lawns or repairing roofs, because the building manager handles most maintenance. Also, many new buildings include shared facilities such as gyms and rooftop gardens. This shows that high-rise living can offer a comfortable lifestyle at a lower cost."}, {"role": "结尾段", "text": "In conclusion, although high-rise apartments can feel crowded and offer less private outdoor space, I believe that their advantages are greater because they save valuable land and provide affordable, convenient homes for city residents."}], "words": 254, "score": {"content": [4, "立场清楚，但题目要求讨论利与弊，缺点只在开头 'crowded and stressful' 和结尾让步各出现一次，讨论不够平衡。"], "dsc": [5, "Body1 讲土地与位置、Body2 讲价格与便利，分工清楚；'This shows that high-rise living can offer a comfortable lifestyle at a lower cost' 回扣论点。"]

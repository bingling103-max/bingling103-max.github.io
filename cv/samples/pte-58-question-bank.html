→ 不用通勤、时间更灵活 → 员工更有精力照顾家庭与自己 → 生活与工作更平衡"}, "paras": [{"role": "开头段", "text": "Nowadays, the trend towards working from home is a controversial issue in society. Some people argue that it gives employees more freedom and saves time, while others believe that it makes teamwork and communication more difficult. Personally, I believe that the advantages of working from home outweigh the disadvantages."}, {"role": "Body1", "text": "To begin with, working from home saves employees a great deal of time and money. For example, a worker who usually spends ninety minutes in traffic every day can use that time to exercise or rest. In addition, people who work at home spend less on petrol, parking and lunches in the city. Also, without a long journey, many employees start work feeling fresh rather than tired and stressed. This shows that remote work can improve both the finances and the wellbeing of workers."}, {"role": "Body2", "text": "Besides, I also believe that working from home helps people balance their job and family life. For example, parents can take their children to school in the morning and still start work on time. In addition, employees can look after an elderly relative or wait for a tradesperson without taking a day off. Also, a flexible schedule allows people to work at the time of day when they concentrate best. This shows that remote work makes it easier for people to meet their responsibilities at home and at work."}, {"role": "结尾段", "text": "In conclusion, although working from home can make it harder for colleagues to communicate and build relationships, I believe that its advantages are greater because it saves time and money and supports a healthier work-life balance."}], "words": 258, "score": {"content": [5, "两个优点（省时省钱、平衡家庭）直接回答题目，开头和结尾都点到了沟通困难这一缺点。"], "dsc": [5, "每段例子层层对应论点，'can use that time to exercise or rest' 与总结句 'wellbeing' 呼应。"], "glr": [3, "三个 'can + 动词' 句与 'This shows that remote work...' 两段重复，几乎没有倒装、非谓语、名词化等变化，GLR 偏低。"], "form": [2, "全文词数在 200–300 区间内，四段结构完整。"], "grammar": [2, "'a worker who usually spends ... can use' 等长主语句控制得当，无明显错误。"], "vocab": [2, "commute 相关的 petrol, tradesperson, flexible schedule, work-life balance 用词地道。"], "spelling": [2, "未发现拼写错误，英式拼写统一。"], "total": 21}, "upgrade": [{"from": "For example, a worker who usually spends ninety minutes in traffic every day can use that time to exercise or rest.", "to": "For example, an employee who no longer faces a ninety-minute daily commute can reinvest that time in exercise or rest.", "why": "'no longer faces' 'reinvest that time in' 更有表现力，提升 Vocabulary 与 GLR。"}, {"from": "This shows that remote work makes it easier for people to meet their responsibilities at home and at work.", "to": "Remote work, in other words, allows people to fulfil their duties at home without sacrificing their professional commitments.", "why": "插入语 'in other words' + 'without sacrificing' 非谓语结构，打破固定总结句，提升 GLR。"}], "traps": ["把题目写成'在家办公的利弊'清单，没有回答'是否利大于弊'，Content 失分。", "Body 里大量写疫情经历（封城、居家隔离），偏离'工作安排'的话题，被判论证偏题。"], "words_bank": [{"w": "remote work", "cn": "远程办公"}, {"w": "commute", "cn": "通勤"}, {"w": "flexible schedule", "cn": "弹性时间"}, {"w": "work-life balance", "cn": "工作与生活的平衡"}, {"w": "productivity", "cn": "生产力；工作效率"}, {"w": "wellbeing", "cn": "身心健康；幸福感"}]}, {"id": "WE05", "type": "C", "typeName": "双方观点", "week": "W2", "theme": "高等教育与职业选择", "prompt": "When choosing a university course, some students focus on subjects that lead to well-paid jobs, while others choose subjects they are personally interested in. Discuss both views and give your own opinion. Support your opinion with reasons and examples from your own experience or observation.", "stance": "两种观点都有道理，但兴趣应放在第一位，因为兴趣带来动力和长期成功。", "plan": {"pro": ["interest keeps students motivated and less likely to drop out", "passion can lead to expertise and good jobs anyway"], "con": ["job-focused subjects give financial security", "stable income helps repay student loans"], "chain": "按兴趣选专业 → 学得更投入、不易退学 → 成为行家 → 长远来看同样能找到好工作"}, "paras": [{"role": "开头段", "text": "Nowadays, the choice between job prospects and personal interest at university is a controversial issue in society. Some people argue that students should choose subjects with good job prospects, while others believe that they should study what they enjoy. Personally, I believe that both views have value, but personal interest should come first."}, {"role": "Body1", "text": "To begin with, it is true that choosing a subject with strong job prospects can give students financial security. For example, graduates in nursing or engineering often find full-time work soon after they finish their degree. In addition, a stable income makes it easier for young people to pay back their student loans. Also, some families make sacrifices to pay for university, so they naturally hope their children will get a reliable job. This shows that job prospects are a reasonable factor when students choose a course."}, {"role": "Body2", "text": "Besides, I also believe that studying a subject they enjoy is even more important for students' long-term success. For example, a student who loves history will usually attend more classes and read more widely than one who chose accounting only for the salary. In addition, interested students are more likely to finish their degree instead of dropping out after the first year. Also, people who enjoy their field often keep learning and become experts, which can lead to good jobs anyway. This shows that interest gives students the motivation they need to succeed."}, {"role": "结尾段", "text": "In conclusion, although subjects with good job prospects can offer financial security, I believe that students should mainly follow their interests because interest keeps them motivated and often leads to success in the long term."}], "words": 268, "score": {"content": [5, "Body1 讨论就业观点、Body2 讨论兴趣观点并表明倾向，完整回应 'Discuss both views and give your own opinion'。"], "dsc": [4, "Body2 用 'Besides, I also believe' 引出与 Body1 相反的观点，连接词逻辑略别扭（更自然的是 'However'），但骨架要求如此。"], "glr": [4, "出现了比较结构 'read more widely than one who chose...' 和非限制定语 'which can lead to'，但整体句型仍高度重复。"], "form": [2, "全文词数在 200–300 区间内，四段结构完整。"], "grammar": [2, "比较级、定语从句使用准确。"], "vocab": [2, "job prospects, financial security, student loans, dropping out 等词准确地道。"], "spelling": [2, "未发现拼写错误，英式拼写统一。"], "total": 21}, "upgrade": [{"from": "Besides, I also believe that studying a subject they enjoy is even more important for students' long-term success.", "to": "On the other hand, genuine interest in a subject is arguably a stronger predictor of long-term success.", "why": "用 'On the other hand' 正确表达转折，'arguably a stronger predictor' 更学术，提升 DSC 与 Vocabulary。"}, {"from": "In addition, interested students are more likely to finish their degree instead of dropping out after the first year.", "to": "In addition, students who are passionate about their field are far less likely to abandon their studies after the first year.", "why": "'passionate about' 'abandon their studies' 替换基础词，提升 Vocabulary。"}], "traps": ["只写自己支持的一方，完全不讨论另一方——C 型要求 discuss both views，Content 会明显扣分。", "两段各说一方，但开头和结尾都没写自己的倾向，漏掉 'give your own opinion'。"], "words_bank": [{"w": "job prospects", "cn": "就业前景"}, {"w": "financial security", "cn": "经济保障"}, {"w": "student loan", "cn": "学生贷款"}, {"w": "motivation", "cn": "动力"}, {"w": "drop out", "cn": "退学；辍学"}, {"w": "career path", "cn": "职业道路"}]}, {"id": "WE06", "type": "C", "typeName": "双方观点", "week": "W10", "theme": "家庭成长青年", "prompt": "Some people believe that parents are mainly responsible for teaching children good behaviour and manners. Others think that schools should play the main role. Discuss both views and give your own opinion. Support your opinion with reasons and examples from your own experience or observation.", "stance": "学校能起辅助作用，但父母承担主要责任，因为孩子模仿父母，而且早期大多数时间在家。", "plan": {"pro": ["children copy their parents' behaviour", "children spend more time at home, especially in early years"], "con": ["schools teach social rules in groups", "teachers can correct bullying immediately"], "chain": "父母天天示范礼貌 → 孩子在家模仿形成习惯 → 学校规则才能真正起作用"}, "paras": [{"role": "开头段", "text": "Nowadays, the responsibility for teaching children good behaviour is a controversial issue in society. Some people argue that parents should play the main role, while others believe that schools are in a better position to do this job. Personally, I believe that schools can help, but parents have the greater responsibility."}, {"role": "Body1", "text": "To begin with, it is true that schools can teach children important social rules. For example, in the classroom children learn to wait for their turn and listen when others are speaking. In addition, group projects teach students how to share tasks and resolve disagreements politely. Also, teachers can notice bullying or rude behaviour and correct it immediately. This shows that schools have a useful role in developing children's behaviour."}, {"role": "Body2", "text": "Besides, I also believe that parents have an even stronger influence because children learn most by copying adults at home. For example, a child who hears their parents say 'please' and 'thank you' every day will usually use these words naturally. In addition, children spend more time with their families than with teachers, especially in the years before they start school. Also, if parents allow rude behaviour at home, a teacher's rules at school are unlikely to change the child's habits. This shows that good manners mainly begin in the family."}, {"role": "结尾段", "text": "In conclusion, although schools can support children in learning social rules, I believe that parents should take the main responsibility because children copy their parents and spend most of their early years at home."}], "words": 246, "score": {"content": [5, "两方观点都有展开，'parents have the greater responsibility' 立场清楚，并在 Body2 给出两条理由。"], "dsc": [5, "Body2 的三个例子（模仿用语、相处时间、家规与校规冲突）逐步加强论点，总结句简洁回扣。"], "glr": [4, "有条件句 'if parents allow ...' 和比较句，但总体仍是固定骨架，句式重复。"], "form": [2, "全文词数在 200–300 区间内，四段结构完整。"], "grammar": [2, "条件句、比较级准确，无明显语法错误。"], "vocab": [2, "social rules, bullying, disagreements, influence 等词使用恰当。"], "spelling": [2, "未发现拼写错误，英式拼写统一。"], "total": 22}, "upgrade": [{"from": "Also, teachers can notice bullying or rude behaviour and correct it immediately.", "to": "Also, teachers are well placed to spot bullying or disrespectful behaviour and address it before it becomes a habit.", "why": "'well placed to' 'spot' 'address it' 更地道，并补出结果，提升 Vocabulary 与论证深度。"}, {"from": "This shows that good manners mainly begin in the family.", "to": "It is, therefore, within the family that good manners are first formed.", "why": "强调句 'It is ... that ...' 增加句式变化，提升 GLR。"}], "traps": ["把'manners'写成'学习成绩'或'纪律管理'，话题偏移导致 Content 扣分。", "Body1 写学校的作用后没有总结句，直接跳到父母，段落之间缺少逻辑连接。"], "words_bank": [{"w": "good manners", "cn": "礼貌；教养"}, {"w": "behaviour", "cn": "行为"}, {"w": "role model", "cn": "榜样"}, {"w": "bullying", "cn": "霸凌"}, {"w": "upbringing", "cn": "家庭教养；成长环境"}, {"w": "social skills", "cn": "社交技能"}]}, {"id": "WE07", "type": "D", "typeName": "问题与对策", "week": "W4", "theme": "环境气候能源", "prompt": "Plastic waste is now found in oceans, rivers and even in the food we eat. Discuss the main causes of this problem and suggest some measures that could be taken to reduce it. Support your opinion with reasons and examples from your own experience or observation.", "stance": "主要原因是一次性包装泛滥；解决要靠政府立规与企业改用环保包装共同发力。", "plan": {"pro": ["single-use packaging is the main cause", "government rules and greener business practices can reduce waste"], "con": ["consumers are mainly to blame", "recycling alone can solve the problem"], "chain": "一次性包装便宜方便 → 日常塑料用量远超回收能力 → 政府禁限＋企业换包装＋清晰回收 → 塑料垃圾减少"}, "paras": [{"role": "开头段", "text": "Nowadays, what causes plastic pollution and how it can be reduced is a controversial issue in society. Some people argue that the problem is mainly caused by careless consumers, while others believe that businesses and governments are more responsible. Personally, I believe that the main cause is the overuse of single-use packaging, and that governments and businesses must work together to solve it."}, {"role": "Body1", "text": "To begin with, the main cause of plastic pollution is the huge amount of single-use packaging. For example, supermarkets often wrap fruit and vegetables in plastic even when it is not necessary. In addition, many takeaway meals come with plastic containers, cutlery and bags that are used only once. Also, plastic water bottles are cheap and convenient, so people often buy a new one every day. This shows that modern packaging and daily habits create far more plastic than the environment can handle."}, {"role": "Body2", "text": "Besides, I also believe that this problem can be reduced if governments and businesses work together. For example, governments can ban single-use plastic bags and charge a small fee for takeaway containers. In addition, companies can switch to paper or reusable packaging and offer discounts to customers who bring their own cups. Also, councils can provide clearly labelled recycling bins in every street and explain which items can be recycled. This shows that stronger rules and better systems can greatly reduce the amount of plastic waste."}, {"role": "结尾段", "text": "In conclusion, although individual consumers also need to change their habits, I believe that plastic pollution is mainly caused by single-use packaging and that it can be reduced through stronger government rules and greener business practices."}], "words": 268, "score": {"content": [5, "Body1 回答原因、Body2 回答对策，两部分都覆盖，且对策（禁袋、收费、换包装、回收箱）与原因一一对应。"], "dsc": [4, "开头用 'controversial issue' 套在'原因与对策'题上略显生硬，'Some people argue ... consumers' 的争论在正文中没有再展开。"], "glr": [4, "'can + 动词' 在 Body2 出现五次以上，句型单一。"], "form": [2, "全文词数在 200–300 区间内，四段结构完整。"], "grammar": [2, "'what causes ... and how it can be reduced' 作主语处理正确，其余句子准确。"], "vocab": [2, "single-use, cutlery, reusable packaging, recycling bins 等环保词使用准确。"], "spelling": [2, "未发现拼写错误，英式拼写统一。"], "total": 21}, "upgrade": [{"from": "For example, governments can ban single-use plastic bags and charge a small fee for takeaway containers.", "to": "For example, a nationwide ban on single-use bags, combined with a small levy on takeaway containers, would quickly change shopping habits.", "why": "名词化 'a nationwide ban' + 'combined with' 非谓语，并说明结果，提升 GLR 与 Vocabulary（levy）。"}, {"from": "Also, plastic water bottles are cheap and convenient, so people often buy a new one every day.", "to": "Also, because bottled water is cheap and convenient, many people buy a fresh bottle daily rather than carrying a reusable one.", "why": "原因状语前置 + 'rather than' 对比，句式更灵活，提升 GLR。"}], "traps": ["只写对策不写原因（或反之），漏答题目的一半，Content 直接扣分。", "对策写成'大家要有环保意识'这种空话，没有具体措施，与原因段也不对应。"], "words_bank": [{"w": "single-use plastic", "cn": "一次性塑料"}, {"w": "packaging", "cn": "包装"}, {"w": "landfill", "cn": "垃圾填埋场"}, {"w": "recycling", "cn": "回收利用"}, {"w": "reusable", "cn": "可重复使用的"}, {"w": "pollution", "cn": "污染"}]}, {"id": "WE08", "type": "D", "typeName": "问题与对策", "week": "W6", "theme": "健康医学运动", "prompt": "In many countries, the number of overweight children is increasing every year. Discuss the causes of this problem and suggest what can be done to solve it. Support your opinion with reasons and examples from your own experience or observation.", "stance": "主要原因是不健康饮食和缺乏运动；家庭和学校合作就能帮孩子养成健康习惯。", "plan": {"pro": ["unhealthy food and too little exercise", "families and schools can work together on diet and activity"], "con": ["it is only the parents' responsibility", "the food industry is the only one to blame"], "chain": "快餐便宜＋屏幕时间多 → 摄入多、消耗少 → 家里备健康餐＋学校改食堂、加体育 → 孩子体重回到健康水平"}, "paras": [{"role": "开头段", "text": "Nowadays, why more children are becoming overweight and how this can be solved is a controversial issue in society. Some people argue that parents should take full responsibility, while others believe that schools and the food industry also play a major role. Personally, I believe that unhealthy food and a lack of exercise are the main causes, and that families and schools must work together to solve this problem."}, {"role": "Body1", "text": "To begin with, many children today eat too much unhealthy food and do too little exercise. For example, fast food and sugary drinks are cheap, tasty and easy to buy near most schools. In addition, busy parents often choose ready meals because they have little time to cook after work. Also, many children spend hours playing video games or watching videos instead of playing outside. This shows that modern lifestyles make it very easy for children to gain weight."}, {"role": "Body2", "text": "Besides, I also believe that families and schools can solve this problem together. For example, parents can cook simple healthy meals at the weekend and freeze them for busy weekdays. In addition, schools can sell fruit and water instead of chips and fizzy drinks in their canteens. Also, schools can offer more sports clubs and make physical education a daily activity. This shows that small changes at home and at school can help children develop healthier habits."}, {"role": "结尾段", "text": "In conclusion, although the food industry also influences what children eat, I believe that childhood obesity is mainly caused by poor diet and inactivity, and that it can be reduced if parents and schools encourage healthy eating and regular exercise."}], "words": 265, "score": {"content": [4, "原因和对策都答到了，但开头的争论点是'谁负责'，而正文写的是'原因＋对策'，开头与正文不完全对应，论证深度一般。"], "dsc": [4, "Body1 前两例讲饮食、第三例讲运动，分类清楚；但 Body2 'schools can' 连用两次，例子之间区分度不高。"], "glr": [4, "有原因从句 'because they have little time' 和 'instead of' 结构，但两段句型几乎一模一样。"], "form": [2, "全文词数在 200–300 区间内，四段结构完整。"], "grammar": [2, "未见语法错误。"], "vocab": [2, "sugary drinks, ready meals, canteens, inactivity, physical education 等词准确。"], "spelling": [2, "未发现拼写错误，英式拼写统一。"], "total": 20}, "upgrade": [{"from": "In addition, busy parents often choose ready meals because they have little time to cook after work.", "to": "In addition, parents with long working hours frequently rely on processed ready meals, which tend to be high in salt and fat.", "why": "'rely on' 'processed' + 非限制定语从句说明危害，信息更完整，提升 Vocabulary 与 GLR。"}, {"from": "Also, schools can offer more sports clubs and make physical education a daily activity.", "to": "Also, making physical education a daily requirement rather than an optional extra would help every child stay active.", "why": "动名词主语 + 'rather than' 对比，句式更多样，提升 GLR。"}], "traps": ["把原因写成'孩子不自律''基因问题'等难以给出对策的点，导致原因段与对策段对不上。", "对策只写'政府应该管'一句话，没有说明谁做、怎么做，Content 判为论证不足。"], "words_bank": [{"w": "obesity", "cn": "肥胖"}, {"w": "overweight", "cn": "超重的"}, {"w": "sugary drinks", "cn": "含糖饮料"}, {"w": "physical education", "cn": "体育课"}, {"w": "inactivity", "cn": "缺乏运动"}, {"w": "balanced diet", "cn": "均衡饮食"}]}, {"id": "WE09", "type": "E", "typeName": "双问直接问句", "week": "W8", "theme": "商业消费广告", "prompt": "Many people today buy far more clothes, gadgets and household items than they actually need. Why do people buy so many things they do not need? What effects does this habit have on individuals and society?", "stance": "人们过度购物主要因为广告和便捷的网购；后果是个人负债和环境破坏。", "plan": {"pro": ["advertising and one-click online shopping drive overbuying", "overbuying causes personal debt and environmental damage"], "con": ["shopping supports the economy and jobs", "buying things is a personal choice that brings pleasure"], "chain": "网红广告＋限时促销＋一键支付 → 冲动消费 → 个人欠债、衣物进填埋场、资源浪费"}, "paras": [{"role": "开头段", "text": "Nowadays, why people buy more than they need and what effects this has is a controversial issue in society. Some people argue that shopping is a personal choice that supports the economy, while others believe that it harms people and the planet. Personally, I believe that people overbuy mainly because of advertising and easy online shopping, and that this habit leads to personal debt and environmental damage."}, {"role": "Body1", "text": "To begin with, advertising and online shopping make buying things too easy and tempting. For example, social media influencers often show new products every day, which makes viewers feel that their own things are out of date. In addition, online stores send messages about 'limited-time' sales, so people worry that they will miss a good deal. Also, shoppers can now buy something with a single click, so they hardly notice how much they spend. This shows that modern marketing encourages people to buy without thinking carefully."}, {"role": "Body2", "text": "Besides, I also believe that this habit has serious effects on both individuals and society. For example, some young people use credit cards or buy-now-pay-later services and fall into debt. In addition, cheap clothes are often thrown away after only a few uses and end up in landfill. Also, producing so many unnecessary goods uses large amounts of energy, water and raw materials. This shows that overbuying damages people's finances as well as the environment."}, {"role": "结尾段", "text": "In conclusion, although shopping can bring pleasure and support local businesses, I believe that people buy too much mainly because of advertising and easy online payment, and that this habit leads to debt and environmental harm."}], "words": 264, "score": {"content": [5, "开头末句直接回答了两个问题（原因：广告与网购；影响：负债与环境），Body1、Body2 分别展开，完整切题。"], "dsc": [5, "Body2 例子从个人（负债）过渡到社会（填埋、资源），与题目 'individuals and society' 对应清楚。"], "glr": [3, "'so people worry' 'so they hardly notice' 两个 so 结果句重复，整体句型单一，未见被动、倒装等变化。"], "form": [2, "全文词数在 200–300 区间内，四段结构完整。"], "grammar": [2, "'which makes viewers feel that ...' 非限制定语从句使用正确。"], "vocab": [2, "influencers, limited-time, buy-now-pay-later, raw materials 等词准确贴题。"], "spelling": [2, "未发现拼写错误，英式拼写统一。"], "total": 21}, "upgrade": [{"from": "Also, shoppers can now buy something with a single click, so they hardly notice how much they spend.", "to": "Also, one-click payment removes the moment of hesitation that might otherwise stop an unnecessary purchase.", "why": "以物作主语 + 'that might otherwise' 定语从句，表达更凝练，提升 GLR 与 Vocabulary。"}, {"from": "In addition, cheap clothes are often thrown away after only a few uses and end up in landfill.", "to": "In addition, the rise of fast fashion means that garments are often discarded after only a few wears, adding to landfill waste.", "why": "'fast fashion' 'discarded' + 现在分词结果状语，提升 Vocabulary 与 GLR。"}], "traps": ["只回答了第一个问题（为什么买），对第二个问题（影响）一笔带过——E 型两问都要答，否则 Content 扣分。", "开头观点句写成 'shopping has good and bad sides'，没有直接回答两个问题，立场句太空。"], "words_bank": [{"w": "consumerism", "cn": "消费主义"}, {"w": "impulse buying", "cn": "冲动消费"}, {"w": "influencer", "cn": "网红；意见领袖"}, {"w": "debt", "cn": "债务"}, {"w": "fast fashion", "cn": "快时尚"}, {"w": "raw materials", "cn": "原材料"}]}, {"id": "WE10", "type": "E", "typeName": "双问直接问句", "week": "W11", "theme": "全球化语言迁移与文化艺术", "prompt": "Around the world, many small languages are spoken by fewer people each year, and some may soon disappear completely. Why is this happening? What can be done to protect these languages?", "stance": "少数语言消失是因为年轻人为学习和工作转向全球通用语；双语教育和媒体支持可以保护它们。", "plan": {"pro": ["global languages offer more study and job opportunities", "bilingual schooling, media and recordings can protect small languages"], "con": ["it is natural for people to choose useful languages", "protecting languages costs too much public money"], "chain": "全球语言带来机会＋城市化迁移 → 年轻人不再说家乡话 → 学校双语课、媒体资助、录音存档 → 语言得以传承"}, "paras": [{"role": "开头段", "text": "Nowadays, why many minority languages are disappearing and how they can be protected is a controversial issue in society. Some people argue that it is natural for people to choose more useful languages, while others believe that every language has cultural value. Personally, I believe that these languages are disappearing because young people need global languages for study and work, and that schools and the media can help to protect them."}, {"role": "Body1", "text": "To begin with, many young people stop using their family language because global languages offer more opportunities. For example, a student who wants to study abroad must spend years learning English instead of their grandparents' language. In addition, most films, games and websites are in major languages. Also, when families move to big cities for work, children often speak only the main language with friends. This shows that economic and social pressure slowly pushes small languages out of daily life."}, {"role": "Body2", "text": "Besides, I also believe that schools and the media can play a key role in protecting these languages. For example, schools can offer bilingual classes so that children learn their community language alongside the national language. In addition, governments can fund radio programmes, television shows and apps in minority languages. Also, local communities can record older speakers telling traditional stories so that the language is not lost. This shows that, with the right support, small languages can continue to be used by future generations."}, {"role": "结尾段", "text": "In conclusion, although people naturally choose languages that offer better jobs, I believe that minority languages are disappearing mainly because of economic and social pressure, and that bilingual education and media support can keep them alive."}], "words": 271, "score": {"content": [5, "开头末句直接回答两问；Body1 给三个具体原因（留学、娱乐内容、城市迁移），Body2 给三条具体措施，完整切题。"], "dsc": [5, "原因段与对策段逻辑对称，总结句 'pushes small languages out of daily life' 概括准确。"], "glr": [4, "出现了 'so that' 目的从句、被动 'can continue to be used'、插入语 'with the right support'，比其他篇略丰富，但整体仍受骨架限制。"], "form": [2, "全文词数在 200–300 区间内，四段结构完整。"], "grammar": [2, "目的从句、被动语态使用准确。"], "vocab": [2, "minority languages, bilingual, alongside, generations 等词准确且有学术感。"], "spelling": [2, "未发现拼写错误，英式拼写统一。"], "total": 22}, "upgrade": [{"from": "For example, a student who wants to study abroad must spend years learning English instead of their grandparents' language.", "to": "For example, students who hope to study overseas often invest years in mastering English, leaving little time for their heritage language.", "why": "'invest years in mastering' + 现在分词结果状语 + 'heritage language'，提升 Vocabulary 与 GLR。"}, {"from": "In addition, governments can fund radio programmes, television shows and apps in minority languages.", "to": "In addition, public funding for radio, television and digital content in minority languages would give young speakers a reason to keep using them.", "why": "名词化主语并补出'为什么有效'，论证更完整，提升 Content 与 GLR。"}], "traps": ["只写'语言是文化瑰宝'这种价值判断，没有回答'为什么在消失'，第一问漏答。", "措施写得太宏观（'全世界一起保护'），没有具体执行者和方法，例子不可信。"], "words_bank": [{"w": "minority language", "cn": "少数民族语言；小语种"}, {"w": "heritage language", "cn": "传承语；祖语"}, {"w": "bilingual education", "cn": "双语教育"}, {"w": "globalisation", "cn": "全球化"}, {"w": "cultural identity", "cn": "文化认同"}, {"w": "preserve", "cn": "保护；保存"}]}], "di": [{"id": "DI01", "tpl": "A", "week": "W8", "theme": "商业消费广告", "chart": {"type": "pie", "title": "How Young Adults Spend Their Monthly Income", "unit": "%", "items": [{"label": "Rent", "value": 38}, {"label": "Food", "value": 22}, {"label": "Transport", "value": 14}, {"label": "Entertainment", "value": 11}, {"label": "Clothing", "value": 9}, {"label": "Savings", "value": 6}]}, "notes": ["标题：young adults / monthly income", "最大：rent 38%", "第二大：food 22%", "最小：savings 6%", "再两个名字：transport, entertainment"], "ans": ["This pie chart shows how young adults spend their monthly income on six things.", "The largest is rent, at about 38 per cent.", "The second largest is food, at about 22 per cent.", "The smallest is savings, at about 6 per cent.", "We can also see transport and entertainment in this chart.", "Overall, the difference between rent and savings is the clearest part."], "ansWords": 63, "up65": "Rent takes about 38 per cent of income, while savings are only about 6 per cent.", "score": {"content": {"est": "3–4", "why": "抓住了最大（rent）、第二大（food）、最小（savin const TYPES = {
  home:{name:"总览"},
  rl:{name:"RL 复述讲座",short:"RL"},
  sst:{name:"SST 听力摘要",short:"SST"},
  we:{name:"WE 大作文",short:"WE"},
  di:{name:"DI 描述图片",short:"DI"}
};
const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const wcount = s=>(String(s).trim().match(/[A-Za-z0-9][A-Za-z0-9'’\-.%$]*/g)||[]).length;
let state = {type:"home", id:null, week:"", sub:""};
let done = {};
try{ done = JSON.parse(localStorage.getItem("pte58done")||"{}"); }catch(e){ done = {}; }
function saveDone(){ try{ localStorage.setItem("pte58done",JSON.stringify(done)); }catch(e){} }

/* ---------- speech (manual only) ---------- */
const TTS = { ok: typeof window!=="undefined" && "speechSynthesis" in window && typeof SpeechSynthesisUtterance!=="undefined" };
function pickVoice(){
  if(!TTS.ok) return null;
  let v=[]; try{ v = speechSynthesis.getVoices()||[]; }catch(e){}
  return v.find(x=>/en-GB/i.test(x.lang)) || v.find(x=>/en-(AU|NZ)/i.test(x.lang)) || v.find(x=>/^en/i.test(x.lang)) || null;
}
function speak(text, rate, onend){
  if(!TTS.ok){ alertBox("这台设备的浏览器不支持朗读。请老师现场读原文，或换用电脑 Chrome。"); return; }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice(); if(v){ u.voice=v; u.lang=v.lang; } else u.lang="en-GB";
    u.rate = rate||0.95;
    if(onend) u.onend = onend;
    speechSynthesis.speak(u);
  }catch(e){}
}
function stopSpeak(){ try{ TTS.ok && speechSynthesis.cancel(); }catch(e){} }
function alertBox(msg){
  const m=$("#msg"); if(m){ m.textContent=msg; m.hidden=false; }
}

/* ---------- timer ---------- */
let tmr=null;
function runPhases(el, phases, done){
  clearInterval(tmr);
  let i=0, left=phases[0].s;
  const draw=()=>{ const mm=String(Math.floor(left/60)).padStart(2,"0"), ss=String(left%60).padStart(2,"0");
    el.innerHTML=`<span class="ph">${esc(phases[i].name)}</span>${mm}:${ss}`; el.classList.add("run"); };
  draw();
  tmr=setInterval(()=>{
    left--;
    if(left<0){ i++; if(i>=phases.length){ clearInterval(tmr); el.classList.remove("run"); el.innerHTML='<span class="ph">时间到</span>00:00'; done&&done(); return; } left=phases[i].s; }
    draw();
  },1000);
}
function stopTimer(el){ clearInterval(tmr); if(el){ el.classList.remove("run"); el.innerHTML='<span class="ph">计时</span>--:--'; } }

/* ---------- nav ---------- */
function renderTabs(){
  $("#tabs").innerHTML = Object.entries(TYPES).map(([k,v])=>{
    const n = k==="home" ? "" : `<small>${DATA[k].length}</small>`;
    return `<button class="tab" role="tab" aria-selected="${state.type===k}" data-t="${k}">${v.short||v.name}${n}</button>`;
  }).join("");
  $("#tabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>go(b.dataset.t, null));
}
function subLabel(t,q){
  if(t==="rl") return q.level+" · "+q.opening;
  if(t==="sst") return "骨架 "+q.skeleton;
  if(t==="we") return q.type+" "+q.typeName;
  if(t==="di") return "模板 "+q.tpl+" · "+({pie:"饼图",bar:"柱状图",line:"折线图",table:"表格",bar2:"双柱图",line2:"双线图",pie2:"双饼图",map:"地图",process:"流程图",picture:"图片"}[q.chart.type]||"");
  return "";
}
function renderRail(){
  const r=$("#rail");
  if(state.type==="home"){
    r.innerHTML = `<div class="note" style="padding:8px">从上面选一个题型开始。<br>做完的题会打 ✓（只存在这台设备的浏览器里）。</div>` +
      ["rl","sst","we","di"].map(t=>`<button class="q" data-t="${t}"><span class="id">${TYPES[t].short}</span><span class="t">${TYPES[t].name}</span><span class="m">${DATA[t].length} 题 · 已做 ${DATA[t].filter(q=>done[q.id]).length}</span></button>`).join("");
    r.querySelectorAll(".q").forEach(b=>b.onclick=()=>go(b.dataset.t,null));
    return;
  }
  const list = DATA[state.type];
  const weeks = [...new Set(list.map(q=>q.week))].sort((a,b)=>parseInt(a.slice(1))-parseInt(b.slice(1)));
  const subs = [...new Set(list.map(q=>subKey(state.type,q)))];
  const shown = list.filter(q=>(!state.week||q.week===state.week)&&(!state.sub||subKey(state.type,q)===state.sub));
  r.innerHTML = `<div class="filt">
     <select id="fw" aria-label="按周主题筛选"><option value="">全部主题</option>${weeks.map(w=>`<option ${w===state.week?"selected":""} value="${w}">${w} ${esc(list.find(q=>q.week===w).theme)}</option>`).join("")}</select>
     <select id="fs" aria-label="按类型筛选"><option value="">全部类型</option>${subs.map(s=>`<option ${s===state.sub?"selected":""} value="${esc(s)}">${esc(s)}</option>`).join("")}</select>
   </div>` +
   (shown.length? shown.map(q=>`<button class="q" data-id="${q.id}" aria-current="${q.id===state.id}"><span class="id">${q.id}</span><span class="t">${esc(q.title||q.chart?.title||q.prompt?.slice(0,40))}</span><span class="m">${q.week} ${esc(q.theme)} · ${esc(subLabel(state.type,q))}</span>${done[q.id]?'<span class="ok" aria-label="已做">✓</span>':""}</button>`).join("") : `<p class="note" style="padding:8px">这个筛选下没有题。</p>`);
  $("#fw").onchange=e=>{state.week=e.target.value;renderRail();};
  $("#fs").onchange=e=>{state.sub=e.target.value;renderRail();};
  r.querySelectorAll(".q").forEach(b=>b.onclick=()=>go(state.type,b.dataset.id));
}
function subKey(t,q){
  if(t==="rl") return q.level;
  if(t==="sst") return "骨架 "+q.skeleton;
  if(t==="we") return q.type+" "+q.typeName;
  if(t==="di") return "模板 "+q.tpl;
}
function go(t,id){
  stopSpeak(); stopTimer();
  if(t!==state.type){ state.week=""; state.sub=""; }
  state.type=t; state.id=id || (t==="home"?null:DATA[t][0].id);
  const h = t==="home" ? "" : state.id.toLowerCase();
  try{ if(location.hash.slice(1)!==h) history.replaceState(null,"",h?"#"+h:location.pathname+location.search); }catch(e){}
  render();
  window.scrollTo({top:0});
}
function fromHash(){
  const h=(location.hash||"").slice(1).toUpperCase();
  for(const t of ["rl","sst","we","di"]){ const q=DATA[t].find(x=>x.id===h); if(q){ state.type=t; state.id=q.id; return; } }
  state.type="home"; state.id=null;
}
window.addEventListener("hashchange",()=>{ fromHash(); render(); });

function render(){
  renderTabs(); renderRail();
  const m=$("#main");
  if(state.type==="home"){ m.innerHTML=homeHTML(); m.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go,null)); return; }
  const q=DATA[state.type].find(x=>x.id===state.id);
  m.innerHTML = ({rl:rlHTML,sst:sstHTML,we:weHTML,di:diHTML})[state.type](q) + navHTML(q);
  bind(q);
}
function navHTML(q){
  const L=DATA[state.type], i=L.findIndex(x=>x.id===q.id);
  return `<div class="bar" style="justify-content:space-between">
    <button class="btn" data-nav="${i-1}" ${i<=0?"disabled":""}>← 上一题</button>
    <button class="btn ${done[q.id]?"":"gold"}" id="markDone">${done[q.id]?"✓ 已做（点击取消）":"标记为已做"}</button>
    <button class="btn" data-nav="${i+1}" ${i>=L.length-1?"disabled":""}>下一题 →</button></div>`;
}
function scoreTable(rows, totalMax){
  let tot=0, mx=0;
  const body=rows.map(([name,arr,max])=>{ tot+=Number(arr[0]); mx+=max; return `<tr><td>${name}</td><td class="s">${arr[0]} / ${max}</td><td>${esc(arr[1])}</td></tr>`; }).join("");
  return `<div class="tbl"><table><thead><tr><th>评分项</th><th>预估</th><th>理由</th></tr></thead><tbody>${body}<tr class="tot"><td>合计</td><td class="s">${tot} / ${totalMax||mx}</td><td></td></tr></tbody></table></div>`;
}
function pronList(p){
  return `<div class="tbl"><table><thead><tr><th>易读错</th><th>读音</th><th>提醒</th></tr></thead><tbody>${(p||[]).map(x=>`<tr><td><b>${esc(x.w)}</b></td><td class="ipa">${esc(x.ipa)}</td><td>${esc(x.tip)}</td></tr>`).join("")}</tbody></table></div>`;
}
function list(arr){ return `<ul>${(arr||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`; }
function hl(s){ return esc(s).replace(/\{\{(.+?)\}\}/g,"<mark>$1</mark>"); }
function head(q, title){
  return `<div class="eyebrow"><b>${q.id}</b><span>${q.week} ${esc(q.theme)}</span><span>${esc(subLabel(state.type,q))}</span></div><h2>${esc(title)}</h2>`;
}

}

/* ---------- charts (SVG) ---------- */
const C=i=>`var(--c${(i%7)+1})`;
function nfmt(v,u){ return (u==="$"?"$":"")+v+(u&&u!=="$"?(u==="%"?"%":""):""); }
function niceMax(m){ const p=Math.pow(10,Math.floor(Math.log10(m||1))); const f=m/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }
function axes(W,H,L,R,T,B,max,yl,unit){
  let s=""; const n=5;
  for(let i=0;i<=n;i++){ const v=max*i/n, y=H-B-(H-T-B)*i/n;
    s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="lbl" x="${L-8}" y="${y+4}" text-anchor="end">${+v.toFixed(1)}</text>`; }
  s+=`<line class="ax" x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}"/>`;
  if(yl) s+=`<text class="lbl" x="${L}" y="${T-12}">${esc(yl)}${unit&&!yl.includes(unit)?" ("+esc(unit)+")":""}</text>`;
  return s;
}
function legend(names,x,y){ return names.map((n,i)=>`<rect x="${x+i*150}" y="${y-10}" width="12" height="12" rx="2" fill="${C(i)}"/><text x="${x+i*150+18}" y="${y}" font-size="13">${esc(n)}</text>`).join(""); }
function wrapLabel(t,x,y,max){ const w=String(t).split(" "); let lines=[""]; w.forEach(x=>{ if((lines[lines.length-1]+" "+x).trim().length>max) lines.push(x); else lines[lines.length-1]=(lines[lines.length-1]+" "+x).trim(); });
  return `<text class="lbl" x="${x}" y="${y}" text-anchor="middle">${lines.map((l,i)=>`<tspan x="${x}" dy="${i?14:0}">${esc(l)}</tspan>`).join("")}</text>`; }
function drawChart(c){
  const t=c.type;
  if(t==="bar"||t==="bar2"){
    const W=680,H=380,L=56,R=16,T=44,B=72;
    const series = t==="bar" ? [{name:"",values:c.items.map(i=>i.value)}] : c.series;
    const labels = t==="bar" ? c.items.map(i=>i.label) : c.xLabels;
    const max=niceMax(Math.max(...series.flatMap(s=>s.values)));
    const gw=(W-L-R)/labels.length, bw=Math.min(46,(gw*0.72)/series.length);
    let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`+axes(W,H,L,R,T,B,max,c.yLabel,c.unit);
    labels.forEach((lb,i)=>{ const gx=L+gw*i+gw/2, x0=gx-bw*series.length/2;
      series.forEach((se,k)=>{ const v=se.values[i], h=(H-T-B)*v/max, x=x0+k*bw, y=H-B-h;
        s+=`<rect x="${x+1}" y="${y}" width="${bw-2}" height="${h}" rx="2" fill="${C(k)}"/><text x="${x+bw/2}" y="${y-5}" text-anchor="middle" font-size="11">${v}</text>`; });
      s+=wrapLabel(lb,gx,H-B+18,14); });
    if(t==="bar2") s+=legend(series.map(x=>x.name),L,H-12);
    return s+"</svg>";
  }
  if(t==="line"||t==="line2"){
    const W=680,H=360,L=56,R=24,T=44,B=58, max=niceMax(Math.max(...c.series.flatMap(s=>s.values))), n=c.xLabels.length;
    const X=i=>L+(W-L-R)*i/(n-1), Y=v=>H-B-(H-T-B)*v/max;
    let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`+axes(W,H,L,R,T,B,max,c.yLabel,c.unit);
    c.xLabels.forEach((x,i)=>s+=`<text class="lbl" x="${X(i)}" y="${H-B+18}" text-anchor="middle">${esc(x)}</text>`);
    c.series.forEach((se,k)=>{ s+=`<polyline fill="none" stroke="${C(k)}" stroke-width="2.5" points="${se.values.map((v,i)=>X(i)+","+Y(v)).join(" ")}"/>`;
      se.values.forEach((v,i)=>s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="${C(k)}"/><text x="${X(i)}" y="${Y(v)-9}" text-anchor="middle" font-size="11">${v}</text>`); });
    if(c.series.length>1||c.series[0].name) s+=legend(c.series.map(x=>x.name),L,H-12);
    return s+"</svg>";
  }
  if(t==="pie"||t==="pie2"){
    const charts = t==="pie" ? [{name:"",items:c.items}] : c.charts;
    const W=charts.length>1?680:560, H=charts.length>1?400:340, r=charts.length>1?110:120;
    let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
    const cats=charts[0].items.map(i=>i.label);
    charts.forEach((ch,k)=>{ const cx= charts.length>1 ? 170+k*340 : 160, cy= charts.length>1?170:170;
      const tot=ch.items.reduce((a,b)=>a+b.value,0); let a=-Math.PI/2;
      ch.items.forEach(it=>{ const ci=cats.indexOf(it.label); const da=2*Math.PI*it.value/tot, a2=a+da;
        const x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
        s+=`<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${da>Math.PI?1:0} 1 ${x2},${y2} Z" fill="${C(ci)}" stroke="var(--sheet)" stroke-width="2"/>`;
        const m=a+da/2, lx=cx+r*0.66*Math.cos(m), ly=cy+r*0.66*Math.sin(m);
        if(it.value>=5) s+=`<text x="${lx}" y="${ly+4}" text-anchor="middle" font-size="12" font-weight="600" style="fill:var(--sheet)">${it.value}${c.unit||""}</text>`;
        else s+=`<text x="${cx+(r+16)*Math.cos(m)}" y="${cy+(r+16)*Math.sin(m)+4}" text-anchor="middle" font-size="11">${it.value}${c.unit||""}</text>`;
        a=a2; });
      if(ch.name) s+=`<text x="${cx}" y="${cy+r+30}" text-anchor="middle" font-size="14" font-weight="600">${esc(ch.name)}</text>`;
    });
    if(charts.length>1){ cats.forEach((n,i)=>{ const x=30+(i%3)*215, y=H-34+Math.floor(i/3)*20 - (cats.length>3?10:0); s+=`<rect x="${x}" y="${y-10}" width="12" height="12" rx="2" fill="${C(i)}"/><text x="${x+18}" y="${y}" font-size="12.5">${esc(n)}</text>`; }); }
    else cats.forEach((n,i)=>{ const y=80+i*28; s+=`<rect x="330" y="${y-11}" width="13" height="13" rx="2" fill="${C(i)}"/><text x="350" y="${y}" font-size="13.5">${esc(n)}</text>`; });
    return s+"</svg>";
  }
  if(t==="table"){
    return `<div class="tbl"><table><thead><tr>${c.columns.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${c.rows.map(r=>`<tr>${r.map((v,i)=>i?`<td class="s">${esc(v)}</td>`:`<td>${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
  if(t==="map"){
    const W=640,H=440,P=30,S=(W-2*P)/100,SY=(H-2*P-20)/100;
    let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><rect x="${P}" y="${P+20}" width="${W-2*P}" height="${H-2*P-20}" fill="none" stroke="var(--line)" stroke-width="2"/>`;
    s+=`<text x="${W-P}" y="${P+6}" text-anchor="end" font-size="13" font-weight="600">N ↑</text>`;
    c.zones.forEach((z,i)=>{ const x=P+z.x*S, y=P+20+z.y*SY, w=z.w*S, h=z.h*SY;
      s+=`<rect x="${x+2}" y="${y+2}" width="${w-4}" height="${h-4}" rx="6" fill="${C(i)}" fill-opacity="0.22" stroke="${C(i)}" stroke-width="1.5"/>`;
      s+=wrapLabel(z.label,x+w/2,y+h/2,Math.max(8,Math.floor(w/8))).replace('class="lbl"','font-size="13" font-weight="600"'); });
    return s+"</svg>";
  }
  if(t==="process"){
    const n=c.steps.length;
    if(c.layout==="cycle"){
      const W=640,H=460,cx=320,cy=235,R=165;
      let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>`;
      const pt=i=>{ const a=-Math.PI/2+2*Math.PI*i/n; return [cx+R*Math.cos(a), cy+R*Math.sin(a)]; };
      for(let i=0;i<n;i++){ const a1=-Math.PI/2+2*Math.PI*(i+0.25)/n, a2=-Math.PI/2+2*Math.PI*(i+0.75)/n;
        s+=`<path d="M${cx+R*Math.cos(a1)},${cy+R*Math.sin(a1)} A${R},${R} 0 0 1 ${cx+R*Math.cos(a2)},${cy+R*Math.sin(a2)}" fill="none" stroke="var(--muted)" stroke-width="1.6" marker-end="url(#ah)"/>`; }
      c.steps.forEach((st,i)=>{ const [x,y]=pt(i); s+=`<rect x="${x-70}" y="${y-26}" width="140" height="52" rx="10" fill="var(--sheet)" stroke="${C(i)}" stroke-width="2"/><text x="${x-58}" y="${y-8}" font-size="11" style="fill:${C(i)}" font-weight="600">${i+1}</text>`+
        wrapLabel(st.label,x,y+(st.sub?-2:4),20).replace('class="lbl"','font-size="12.5" font-weight="600"')+(st.sub?`<text class="lbl" x="${x}" y="${y+18}" text-anchor="middle" font-size="10.5">${esc(st.sub)}</text>`:""); });
      return s+"</svg>";
    }
    const cols=Math.min(n,4), rows=Math.ceil(n/cols), W=680, bw=140, bh=66, gx=(W-cols*bw)/(cols+1), H=rows*130+20;
    let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>`;
    const pos=i=>{ const r=Math.floor(i/cols), k=i%cols, kk= r%2? cols-1-k : k; return [gx+kk*(bw+gx), 30+r*130]; };
    c.steps.forEach((st,i)=>{ const [x,y]=pos(i);
      if(i<n-1){ const [x2,y2]=pos(i+1); if(y2===y){ const fwd=x2>x; s+=`<line x1="${fwd?x+bw:x}" y1="${y+bh/2}" x2="${fwd?x2-4:x2+bw+4}" y2="${y+bh/2}" stroke="var(--muted)" stroke-width="1.6" marker-end="url(#ah2)"/>`; }
        else s+=`<line x1="${x+bw/2}" y1="${y+bh}" x2="${x2+bw/2}" y2="${y2-4}" stroke="var(--muted)" stroke-width="1.6" marker-end="url(#ah2)"/>`; }
      s+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="10" fill="var(--sheet)" stroke="${C(i)}" stroke-width="2"/><text x="${x+10}" y="${y+16}" font-size="11" font-weight="600" style="fill:${C(i)}">${i+1}</text>`+
        wrapLabel(st.label,x+bw/2,y+(st.sub?30:38),19).replace('class="lbl"','font-size="12.5" font-weight="600"')+(st.sub?`<text class="lbl" x="${x+bw/2}" y="${y+56}" text-anchor="middle" font-size="10.5">${esc(st.sub)}</text>`:""); });
    return s+"</svg>";
  }
  if(t==="picture"){
    const W=640,H=420;
    const zone={background:[60,30,520,110],left:[30,160,170,180],centre:[230,140,180,180],right:[440,160,170,180],front:[150,340,340,48]};
    let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="10" width="${W-20}" height="${H-20}" rx="14" fill="var(--panel)"/><rect x="10" y="${H*0.36}" width="${W-20}" height="${H*0.64-10}" rx="0" fill="var(--sheet)" fill-opacity="0.55"/>`;
    const groups={}; c.elements.forEach(e=>(groups[e.pos]=groups[e.pos]||[]).push(e));
    Object.entries(groups).forEach(([p,els])=>{ const [x,y,w,h]=zone[p]||zone.centre;
      els.forEach((e,i)=>{ const horiz = p==="background"||p==="front"; const ex= horiz ? x+w*(i+0.5)/els.length : x+w/2, ey= horiz ? y+h/2 : y+h*(i+0.5)/els.length;
        const big=p==="centre"?44:p==="background"?30:36;
        s+=`<text x="${ex}" y="${ey}" text-anchor="middle" font-size="${big}">${esc(e.icon)}</text>`+wrapLabel(e.label,ex,ey+18,18).replace('class="lbl"','font-size="12" font-weight="600"'); }); });
    s+=`<text class="lbl" x="${W-24}" y="30" text-anchor="end" font-size="11">示意图：按「中间 → 旁边 → 背景」说</text>`;
    return s+"</svg>";
  }
  return `<p class="note">（图表类型 ${esc(t)} 暂不支持）</p>`;
}

function bindWC(id,lo,hi,mid){
  const pad=$("#pad"), wc=$("#wc"); if(!pad||!wc) return;
  const upd=()=>{ const n=wcount(pad.value); let b="b",t="Form 0";
    if(n>=lo&&n<=hi){b="g";t="Form 2";} else if(n>=mid[0]&&n<=mid[1]){b="w";t="Form 1";}
    wc.innerHTML=`${n} 词<span class="band ${b}">${n?t:"还没写"}</span>`; };
  pad.addEventListener("input",upd); upd();
}

  }
  if(state.type==="sst") bindWC("pad",50,70,[40,100]);
  if(state.type==="we")  bindWC("pad",200,300,[120,380]);
  document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{ const L=DATA[state.type]; const i=+b.dataset.nav; if(L[i]) go(state.type,L[i].id); });
  $("#markDone").onclick=()=>{ if(done[q.id]) delete done[q.id]; else done[q.id]=1; saveDone(); render(); };
}
fromHash(); render();
</script>
